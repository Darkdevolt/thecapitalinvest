name: Definitive Cours UI cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[cours-cleaned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove every legacy Cours reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/admin.html')
          s=p.read_text(encoding='utf-8')
          exact=[
            '<script src="admin/js/historique.js"></script>',
            '<script src="admin/js/cours-control.js"></script>',
            '<script src="admin/js/cours-control-enhanced.js"></script>',
            '<link rel="stylesheet" href="admin/css/cours-control-enhanced.css">'
          ]
          for tag in exact:
              s=s.replace(tag+'\n','').replace(tag,'')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f public/admin/js/cours-control.js public/admin/js/cours-control-enhanced.js public/admin/js/historique.js public/admin/js/cours-historique.js public/admin/js/historique-quality.js public/admin/css/cours-control-enhanced.css
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): remove every legacy Cours reference [cours-cleaned]"
          git push
