# one-off integration workflow
name: Integrate session control

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'chore: integrate session control loader'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Integrate session manager
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/admin/js/main.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* THE CAPITAL — séance control loader */'
          if marker not in s:
              s += r'''

/* THE CAPITAL — séance control loader */
(function(){
  'use strict';
  var loaded=false;
  function moveToBottom(){
    var panel=document.getElementById('panel-cours');
    var box=document.getElementById('tc-seances-control');
    if(panel && box) panel.appendChild(box);
  }
  function load(){
    if(loaded) return;
    if(typeof TK !== 'string' || !TK) return;
    if(!document.getElementById('panel-cours')) return;
    loaded=true;
    var s=document.createElement('script');
    s.id='seances-control-script';
    s.src='js/seances.js?v=20260816';
    s.onload=function(){
      moveToBottom();
      if(window.SeancesControl && typeof window.SeancesControl.refresh==='function'){
        window.SeancesControl.refresh();
        setTimeout(moveToBottom,250);
      }
    };
    s.onerror=function(){ console.error('[main] Impossible de charger js/seances.js'); };
    document.head.appendChild(s);
  }
  var timer=setInterval(function(){
    load();
    if(loaded) clearInterval(timer);
  },300);
  document.addEventListener('DOMContentLoaded',load);
  window.addEventListener('load',load);
})();
'''
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/admin/js/main.js
          git diff --cached --quiet || git commit -m "chore: integrate session control loader"
          git push
          rm -f .github/workflows/integrate-seance-control.yml
          git add .github/workflows/integrate-seance-control.yml
          git diff --cached --quiet || git commit -m "chore: remove one-off integration workflow"
          git push