name: Position public BRVM landing preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/landing-market-preview-position.yml'

permissions:
  contents: write

jobs:
  position-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move preview into landing flow
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')

          section='<section id="tcLandingMarketPreview" aria-label="Aperçu du marché BRVM"></section>'
          css='<link rel="stylesheet" href="/css/landing-market-preview.css?v=20260831">'
          js='<script src="/js/landing-market-preview.js?v=20260831" defer></script>'

          # Remove any previous wiring, regardless of where it was inserted.
          s=s.replace('<!-- THE CAPITAL — Public BRVM market preview -->\n'+section+'\n'+css+'\n'+js+'\n','')
          s=s.replace(section,'')
          s=s.replace(css,'')
          s=s.replace(js,'')

          anchor='<section class="section" id="capital"'
          if anchor not in s:
              raise SystemExit('Landing capital section not found')
          s=s.replace(anchor, section+'\n'+anchor, 1)
          s=s.replace('</head>',css+'\n</head>',1)
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/landing-market-preview-position.yml
          git add public/index.html
          git commit -m "fix(landing): position public BRVM snapshot after hero"
          git push
