name: Optimize app bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: "!contains(github.event.head_commit.message, 'optimize app bootstrap')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert app scripts to defer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('public/app/app.html')
          s = p.read_text(encoding='utf-8')

          # All external app scripts may defer: classic defer preserves document order.
          # The first inline auth guard remains synchronous by design.
          s = re.sub(r'<script\s+src=', '<script defer src=', s)
          s = re.sub(r'<script\s+defer\s+defer\s+src=', '<script defer src=', s)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit optimized app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app/app.html
          git diff --cached --quiet && exit 0
          git commit -m "perf(app): optimize app bootstrap"
          git push

      - name: Remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/optimize-app-bootstrap.yml
          git commit -m "chore: remove bootstrap optimization workflow"
          git push
