name: Final UI source fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: finalize logo and secondary mobile navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch complete source files in checkout
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          root = Path('public')

          # Landing logo: patch the exact existing source declaration only.
          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          old = '.hero-circle-inner{text-align:center;width:78%;display:flex;align-items:center;justify-content:center}.hero-circle-inner img{display:block;width:100%;height:auto;max-width:360px;max-height:160px;object-fit:contain;object-position:center;filter:brightness(1.08) contrast(1.02)}'
          new = '.hero-circle-inner{text-align:center;width:88%;height:88%;display:flex;align-items:center;justify-content:center}.hero-circle-inner img{display:block;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;object-position:center;filter:brightness(1.08) contrast(1.02)}'
          if old in index:
              index = index.replace(old, new, 1)
          elif new not in index:
              raise SystemExit('Landing hero source CSS does not match the expected complete source; aborting.')

          old_mobile = '.hero-circle-inner{width:72%}.hero-circle-inner img{max-width:260px;max-height:120px}'
          new_mobile = '.hero-circle-inner{width:82%;height:82%}.hero-circle-inner img{width:100%;height:100%;max-width:none;max-height:none}'
          if old_mobile in index:
              index = index.replace(old_mobile, new_mobile, 1)
          elif new_mobile not in index:
              raise SystemExit('Landing mobile hero source CSS does not match; aborting.')

          old_small = '.hero-circle-inner{width:70%}.hero-circle-inner img{max-width:220px;max-height:100px}'
          new_small = '.hero-circle-inner{width:82%;height:82%}.hero-circle-inner img{width:100%;height:100%;max-width:none;max-height:none}'
          if old_small in index:
              index = index.replace(old_small, new_small, 1)
          elif new_small not in index:
              raise SystemExit('Landing small-mobile hero source CSS does not match; aborting.')

          if "fetch('/api/marche?type=cours')" not in index:
              raise SystemExit('Ticker API call changed; aborting.')
          if 'assets/the-capital-logo.png' not in index:
              raise SystemExit('Official logo asset missing; aborting.')
          index_path.write_text(index, encoding='utf-8')

          # Shared secondary-page stylesheet: append a scoped block, preserving every existing byte.
          style_path = root / 'style.css'
          css = style_path.read_text(encoding='utf-8')
          marker = '/* THE CAPITAL — FINAL SECONDARY MOBILE NAV */'
          if marker not in css:
              css += '''\n\n/* THE CAPITAL — FINAL SECONDARY MOBILE NAV */\nbody.menu-open { overflow: hidden; }\n.mobile-nav-backdrop { display:block; position:fixed; inset:0; background:rgba(0,0,0,.38); opacity:0; visibility:hidden; pointer-events:none; z-index:98; transition:opacity .2s ease,visibility .2s ease; }\n.mobile-nav-backdrop.is-open { opacity:1; visibility:visible; pointer-events:auto; }\n@media (max-width:900px) {\n  header, header.scrolled { padding-left:16px; padding-right:16px; padding-top:max(10px,env(safe-area-inset-top)); padding-bottom:10px; min-height:64px; }\n  .hamburger { display:flex; width:48px; height:48px; min-width:48px; flex:0 0 48px; align-items:center; justify-content:center; gap:5px; padding:0; border:1px solid var(--border); border-radius:10px; background:rgba(17,16,9,.88); position:relative; z-index:102; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }\n  .hamburger span { display:block; width:20px; height:1.5px; background:var(--gold); transition:transform .22s ease,opacity .22s ease; }\n  .hamburger.open span:nth-child(1) { transform:translateY(6.5px) rotate(45deg); }\n  .hamburger.open span:nth-child(2) { opacity:0; }\n  .hamburger.open span:nth-child(3) { transform:translateY(-6.5px) rotate(-45deg); }\n  .mobile-menu { display:flex; position:fixed; top:calc(64px + env(safe-area-inset-top)); left:8px; right:8px; max-height:calc(100svh - 76px - env(safe-area-inset-top)); overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px; background:rgba(10,8,4,.98); backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:14px; box-shadow:0 24px 70px rgba(0,0,0,.55); opacity:0; visibility:hidden; pointer-events:none; transform:translateY(-8px); transition:opacity .2s ease,transform .2s ease,visibility .2s ease; z-index:101; }\n  .mobile-menu.open { opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }\n  .mobile-menu a { display:flex; align-items:center; min-height:48px; padding:12px 14px; border:0; border-radius:9px; color:var(--cream); text-decoration:none; font-size:12px; letter-spacing:.1em; text-transform:uppercase; -webkit-tap-highlight-color:transparent; }\n  .mobile-menu a:hover, .mobile-menu a:active, .mobile-menu a.active { color:var(--gold); background:rgba(184,150,78,.07); }\n  .mobile-menu .nav-cta { margin:6px 0 0; justify-content:center; background:var(--gold)!important; color:var(--black)!important; font-weight:500!important; }\n}\n@media (hover:none) { .hamburger, .mobile-menu a { touch-action:manipulation; } }\n'''
              style_path.write_text(css, encoding='utf-8')

          # Add the shared controller to every actual secondary public page that has the legacy menu.
          touched = []
          for path in sorted(root.glob('*.html')):
              if path.name in {'index.html', 'app.html'}:
                  continue
              html = path.read_text(encoding='utf-8')
              if 'id="hamburger"' not in html or 'id="mobile-menu"' not in html:
                  continue
              if 'js/mobile-nav.js' not in html:
                  if '</body>' not in html:
                      raise SystemExit(f'Missing </body> in {path}; aborting.')
                  html = html.replace('</body>', '  <script src="js/mobile-nav.js" defer></script>\n\n</body>', 1)
                  path.write_text(html, encoding='utf-8')
              touched.append(path.name)

          if not touched:
              raise SystemExit('No secondary page with the expected menu markup was found.')

          # Hard guard: no API or portfolio files may be changed by this workflow.
          status = subprocess.check_output(['git','status','--short'], text=True).splitlines()
          allowed = {'public/index.html','public/style.css','public/js/mobile-nav.js'} | {f'public/{x}' for x in touched}
          for line in status:
              p = line[3:]
              if p.startswith('api/') or '/api/' in p or 'portefeuille-' in p or 'portfolio-' in p:
                  raise SystemExit(f'Forbidden file changed: {p}')

          print('Patched secondary pages:', ', '.join(touched))
          print('Changed files:', *status, sep='\n')

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/the-capital-logo.png
          grep -q "fetch('/api/marche?type=cours')" public/index.html
          grep -q "assets/the-capital-logo.png" public/index.html
          grep -q "THE CAPITAL — FINAL SECONDARY MOBILE NAV" public/style.css
          grep -q "js/mobile-nav.js" public/pricing.html || true
          if git status --short | grep -E '(^| )api/|/api/|portefeuille-|portfolio-' ; then exit 1; fi
          git config user.name 'The Capital Engineering Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public
          git rm .github/workflows/final-ui-source-fix.yml
          git commit -m 'fix: finalize logo and secondary mobile navigation'
          git push origin HEAD:main
