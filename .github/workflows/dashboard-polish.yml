name: Dashboard polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply dashboard improvements
        shell: python
        run: |
          from pathlib import Path

          app = Path('public/app/app.html')
          css = Path('public/app/css/style.css')
          js = Path('public/app/js/views/overview.js')

          html = app.read_text(encoding='utf-8')
          anchor = '''  <div class="grid-3" id="overviewStats">'''
          news = '''  <section class="dashboard-news card" aria-label="Dernières actualités">
    <div class="dashboard-news-head">
      <div>
        <div class="eyebrow">ACTUALITÉS MARCHÉ</div>
        <div class="card-title">Dernières actualités</div>
      </div>
      <button type="button" class="news-refresh" onclick="renderNewsFeed()">Actualiser</button>
    </div>
    <div id="newsFeed" class="dashboard-news-grid">
      <div class="news-skeleton"></div><div class="news-skeleton"></div><div class="news-skeleton"></div>
    </div>
  </section>
'''
          if 'class="dashboard-news card"' not in html:
              if anchor not in html:
                  raise SystemExit('overview stats anchor not found')
              html = html.replace(anchor, news + anchor, 1)

          # Force a fresh stylesheet URL after the visual overhaul.
          html = html.replace('app/css/style.css?v=2', 'app/css/style.css?v=3', 1)
          app.write_text(html, encoding='utf-8')

          extra_css = r'''

/* Dashboard v3 — responsive financial-terminal polish */
.dashboard-news{margin:0 0 18px;overflow:hidden;min-width:0}
.dashboard-news-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;border-bottom:1px solid var(--border2);min-width:0}
.dashboard-news-head>div{min-width:0}.dashboard-news-head .card-title{margin-top:3px;font-size:15px}
.eyebrow{font:600 9px var(--sans);letter-spacing:.13em;color:var(--gold);text-transform:uppercase}
.news-refresh{border:1px solid var(--border2);background:rgba(184,150,78,.05);color:var(--muted);border-radius:7px;padding:7px 10px;font:500 10px var(--sans);cursor:pointer;white-space:nowrap}.news-refresh:hover{color:var(--gold);border-color:var(--gold-dim)}
.dashboard-news-grid{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:0;min-width:0}
.dashboard-news-grid .news-item{min-width:0;padding:15px 17px;border-right:1px solid var(--border2);cursor:pointer;transition:background .16s ease}.dashboard-news-grid .news-item:last-child{border-right:0}.dashboard-news-grid .news-item:hover{background:rgba(184,150,78,.035)}
.dashboard-news-grid .news-item:first-child{background:linear-gradient(90deg,rgba(184,150,78,.07),transparent)}
.dashboard-news-grid .badge{display:inline-flex;margin-bottom:8px;padding:3px 7px;border-radius:4px;font:600 8px var(--sans);letter-spacing:.08em;text-transform:uppercase;background:rgba(184,150,78,.1);color:var(--gold);border:1px solid rgba(184,150,78,.18)}
.dashboard-news-grid .news-title{font:500 14px/1.4 var(--sans);color:var(--cream);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.dashboard-news-grid .news-meta{margin-top:9px;color:var(--dim);font:400 10px/1.45 var(--sans);overflow-wrap:anywhere}
.news-skeleton{height:105px;margin:14px;border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.025),rgba(255,255,255,.06),rgba(255,255,255,.025));background-size:200% 100%;animation:tcShimmer 1.5s infinite}
@keyframes tcShimmer{from{background-position:200% 0}to{background-position:-200% 0}}
#coursTable tr{cursor:pointer;transition:background .14s ease}#coursTable tr:hover{background:rgba(184,150,78,.045)}
#coursTable td{white-space:nowrap}#coursTable td:nth-child(1){font-family:var(--mono);font-weight:600;color:var(--cream)}
#coursTable td:nth-child(2){font-family:var(--mono);font-weight:500;color:var(--cream)}
#coursTable td:nth-child(3){font-family:var(--mono);font-weight:600}
#coursTable td:nth-child(3) .change-pill{font-weight:600}
#coursTable td:nth-child(4),#coursTable td:nth-child(5){font-family:var(--mono);color:var(--muted)}
.grid-7030{min-width:0}.grid-7030>.card,.grid-7030>div{min-width:0}
.card,.stat-card,.table-wrap{min-width:0;max-width:100%}.table-wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.table-wrap table{width:100%;min-width:720px;border-collapse:collapse}.table-wrap th,.table-wrap td{max-width:280px;overflow:hidden;text-overflow:ellipsis}
.card-header{min-width:0;flex-wrap:wrap}.card-header .card-title{min-width:0;overflow-wrap:anywhere}
@media(max-width:900px){.dashboard-news-grid{grid-template-columns:1fr 1fr}.dashboard-news-grid .news-item:first-child{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--border2)}.dashboard-news-grid .news-item:nth-child(2){border-right:1px solid var(--border2)}.dashboard-news-grid .news-item:nth-child(3){border-right:0}}
@media(max-width:700px){.dashboard-news-head{padding:13px}.dashboard-news-grid{grid-template-columns:1fr}.dashboard-news-grid .news-item,.dashboard-news-grid .news-item:nth-child(2){border-right:0;border-bottom:1px solid var(--border2)}.dashboard-news-grid .news-item:last-child{border-bottom:0}.dashboard-news-grid .news-item:first-child{grid-column:auto}.dashboard-news-grid .news-title{font-size:13px;-webkit-line-clamp:4}.table-wrap table{min-width:760px}.grid-7030{gap:12px}.movers-header{overflow:visible}}
'''
          current_css = css.read_text(encoding='utf-8')
          if '/* Dashboard v3 — responsive financial-terminal polish */' not in current_css:
              css.write_text(current_css + extra_css, encoding='utf-8')

          source = js.read_text(encoding='utf-8')
          old = """  function renderNewsFeed(){const container=document.getElementById('newsFeed');if(!container)return;const recent=(window.allAnalyses||[]).slice(0,5);if(!recent.length){container.innerHTML='<div class=\"empty-state\">Aucune analyse disponible</div>';return;}container.innerHTML=recent.map(a=>{const badgeClass=(a.recommandation||'').toLowerCase(),badgeText=a.recommandation||'NEWS',ticker=a.ticker||', ';return `<div class=\"news-item\"><span class=\"badge ${escapeHtml(badgeClass)}\">${escapeHtml(badgeText)}</span><div class=\"news-title\">${escapeHtml(a.titre||'Analyse '+ticker)}</div><div class=\"news-meta\">${escapeHtml(ticker)} • ${fmtDate(a.date_analyse)} • Objectif: ${a.objectif||', '} FCFA</div></div>`;}).join('');}"""
          new = """  function renderNewsFeed(){const container=document.getElementById('newsFeed');if(!container)return;const recent=(window.allAnalyses||[]).slice().sort((a,b)=>new Date(b.date_analyse||0)-new Date(a.date_analyse||0)).slice(0,3);if(!recent.length){container.innerHTML='<div class=\"empty-state\">Aucune actualité disponible pour le moment</div>';return;}container.innerHTML=recent.map((a,i)=>{const badgeClass=(a.recommandation||'news').toLowerCase(),badgeText=a.recommandation||'NEWS',ticker=a.ticker||'';return `<article class=\"news-item\" onclick=\"${ticker?`openFiche('${escapeHtml(ticker)}')`:''}\"><span class=\"badge ${escapeHtml(badgeClass)}\">${escapeHtml(badgeText)}</span><div class=\"news-title\">${escapeHtml(a.titre||'Actualité marché')}</div><div class=\"news-meta\">${escapeHtml(ticker||'Marché BRVM')} • ${fmtDate(a.date_analyse)}${a.objectif?` • Objectif ${fmt(a.objectif)} FCFA`:''}</div></article>`;}).join('');}"""
          if old in source:
              source = source.replace(old,new,1)
          else:
              print('renderNewsFeed exact block not found; leaving logic unchanged')
          js.write_text(source, encoding='utf-8')

      - name: Commit and finish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app/app.html public/app/css/style.css public/app/js/views/overview.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: redesign BRVM dashboard layout"
          git push
          rm -f .github/workflows/dashboard-polish.yml
          git add .github/workflows/dashboard-polish.yml
          git commit -m "chore: remove one-time dashboard polish workflow"
          git push
