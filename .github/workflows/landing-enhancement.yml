name: Apply landing enhancement
on:
  push:
    paths-ignore:
      - 'public/index.html'
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancement assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          if '/landing-enhancement.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="/landing-enhancement.css"><script src="/landing-enhancement.js" defer></script></head>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit landing enhancement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git diff --cached --quiet || git commit -m 'feat(landing): activate enhanced visual layer'
          git push
