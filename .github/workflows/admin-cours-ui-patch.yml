name: Admin Cours UI Patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/admin-cours-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Cours control load deterministic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/admin.html')
          s = p.read_text(encoding='utf-8')

          css = '<link rel="stylesheet" href="admin/css/cours-control.css">'
          css_v = '<link rel="stylesheet" href="admin/css/cours-control.css?v=20260815-1430">'
          if css in s:
              s = s.replace(css, css_v, 1)
          elif 'cours-control.css?v=20260815-1430' not in s:
              raise SystemExit('cours-control.css introuvable')

          js = '<script src="admin/js/cours-control.js"></script>'
          js_v = '<script src="admin/js/cours-control.js?v=20260815-1430"></script>'
          if js in s:
              s = s.replace(js, js_v, 1)
          elif 'cours-control.js?v=20260815-1430' not in s:
              raise SystemExit('cours-control.js introuvable')

          old_boot = '''<script>\ninit().catch(function(err){\n    console.error('Fatal init error:', err);\n    hideLoadingScreen();\n    showFatalError('Erreur fatale', err.message || 'Erreur inconnue');\n});\n</script>'''
          new_boot = '''<script>\ninit().then(function(){\n    setTimeout(function(){\n        if(window.CoursControl && typeof window.CoursControl.init === 'function'){\n            window.CoursControl.init();\n        }\n    },0);\n}).catch(function(err){\n    console.error('Fatal init error:', err);\n    hideLoadingScreen();\n    showFatalError('Erreur fatale', err.message || 'Erreur inconnue');\n});\n</script>'''
          if old_boot in s:
              s = s.replace(old_boot, new_boot, 1)
          elif 'window.CoursControl.init();' not in s:
              raise SystemExit('Bloc init attendu introuvable')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit UI patch
        run: |
          git config user.name 'The Capital Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/admin.html
          git diff --cached --quiet && echo 'No changes' && exit 0
          git commit -m 'fix(admin): deterministic Cours control boot'
          git push