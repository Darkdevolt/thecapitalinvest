name: Admin Cours UI Patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/admin-cours-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Improve Cours & Historique Admin UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/admin.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '<button class="admin-tab" onclick="switchTab(\'cours\',this)">Cours</button>',
              '<button class="admin-tab" onclick="switchTab(\'cours\',this)">Cours &amp; Historique</button>'
          )

          old = '''        <div class="section-header"><div class="section-title">Cours <em>BRVM</em></div></div>\n        <div class="info-box" style="margin-bottom:16px;"><strong>Colonnes :</strong> ticker · date_seance · cours · ouverture · plus_haut · plus_bas · volume · <strong>variation</strong> · capitalisation · <strong>+haut_52s (calculé)</strong> · <strong>+bas_52s (calculé)</strong></div>'''
          new = '''        <div class="section-header">\n            <div>\n                <div class="section-title">Cours &amp; Historique <em>BRVM</em></div>\n                <div style="margin-top:6px;color:var(--muted);font-size:12px;max-width:820px;line-height:1.6;">Centre de contrôle des données de marché. Ici, vous gérez les cours récents et vous accédez à l’archive des séances historiques. Les contrôles de cohérence sont appliqués avant l’enregistrement.</div>\n            </div>\n        </div>\n\n        <div class="card" style="margin-bottom:16px;border-left:3px solid var(--gold);">\n            <div class="card-header"><span class="card-title">Comment utiliser cette section ?</span></div>\n            <div style="padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;">\n                <div style="padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:4px;">\n                    <div style="font-size:11px;color:var(--gold);font-family:var(--mono);margin-bottom:7px;">01 · AJOUTER</div>\n                    <div style="font-size:13px;color:var(--cream);font-weight:500;margin-bottom:5px;">Enregistrer un nouveau cours</div>\n                    <div style="font-size:11px;color:var(--muted);line-height:1.55;">Renseignez le ticker, la date et le cours de clôture. Les autres champs permettent de conserver les données complètes de la séance.</div>\n                </div>\n                <div style="padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:4px;">\n                    <div style="font-size:11px;color:var(--gold);font-family:var(--mono);margin-bottom:7px;">02 · MODIFIER</div>\n                    <div style="font-size:13px;color:var(--cream);font-weight:500;margin-bottom:5px;">Corriger un cours existant</div>\n                    <div style="font-size:11px;color:var(--muted);line-height:1.55;">Dans le tableau, utilisez l’action de modification sur la ligne concernée. Vous pouvez ensuite corriger les champs et enregistrer.</div>\n                </div>\n                <div style="padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:4px;">\n                    <div style="font-size:11px;color:var(--gold);font-family:var(--mono);margin-bottom:7px;">03 · CONTRÔLER</div>\n                    <div style="font-size:13px;color:var(--cream);font-weight:500;margin-bottom:5px;">Validation des données</div>\n                    <div style="font-size:11px;color:var(--muted);line-height:1.55;">Les valeurs sont contrôlées avant écriture : formats, cohérence des prix, variation et limite BRVM de ±7,5 %.</div>\n                </div>\n                <div style="padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:4px;">\n                    <div style="font-size:11px;color:var(--gold);font-family:var(--mono);margin-bottom:7px;">04 · HISTORIQUE</div>\n                    <div style="font-size:13px;color:var(--cream);font-weight:500;margin-bottom:5px;">Retrouver les anciennes séances</div>\n                    <div style="font-size:11px;color:var(--muted);line-height:1.55;">L’archive Admin conserve la gestion des données historiques. Elle est séparée visuellement pour éviter de mélanger cours courants et anciennes séances.</div>\n                </div>\n            </div>\n            <div style="padding:0 18px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;">\n                <div class="info-box" style="margin:0;flex:1;min-width:280px;"><strong>À retenir :</strong> le tableau ci-dessous sert aux cours récents. Pour les anciennes séances, ouvrez <strong>Archive</strong> dans le menu Admin.</div>\n            </div>\n        </div>\n\n        <div class="info-box" style="margin-bottom:16px;"><strong>Données gérées :</strong> ticker · date · clôture · ouverture · plus haut · plus bas · volume · variation · capitalisation · +haut 52S · +bas 52S. Les deux dernières valeurs sont calculées automatiquement.</div>'''
          if old not in s:
              raise SystemExit('Bloc Cours attendu introuvable')
          s = s.replace(old, new, 1)

          s = s.replace(
              '<div class="card-header"><span class="card-title">Ajouter / Modifier un cours</span></div>',
              '<div class="card-header"><span class="card-title">Ajouter un cours</span><span style="font-size:11px;color:var(--muted);margin-left:auto;">Pour modifier une ligne existante, utilisez l’action de modification dans le tableau ci-dessous.</span></div>',
              1
          )

          s = s.replace(
              '<button class="btn btn-primary" onclick="addCours()">Enregistrer le cours</button>',
              '<button class="btn btn-primary" onclick="addCours()">✓ Enregistrer le cours</button>',
              1
          )

          s = s.replace(
              '<span class="card-title">Derniers cours enregistrés</span>',
              '<span class="card-title">Cours enregistrés — consulter &amp; modifier</span>',
              1
          )

          marker = '<div class="tw">\n                <table>\n                    <thead><tr><th><input type="checkbox" class="row-check" onchange="toggleAll(coursData.map(function(r){return r.id}),this)"></th>'
          replacement = '<div style="padding:12px 18px 0;color:var(--muted);font-size:11px;line-height:1.55;">Utilisez les filtres pour retrouver une séance. <strong style="color:var(--cream);">Modifier</strong> ouvre les données de la ligne pour correction ; <strong style="color:var(--cream);">Supprimer</strong> retire définitivement la ligne. Les suppressions multiples demandent une confirmation.</div>\n            <div class="tw">\n                <table>\n                    <thead><tr><th><input type="checkbox" class="row-check" onchange="toggleAll(coursData.map(function(r){return r.id}),this)"></th>'
          if marker not in s:
              raise SystemExit('Tableau Cours attendu introuvable')
          s = s.replace(marker, replacement, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit UI patch
        run: |
          git config user.name 'The Capital Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/admin.html
          git diff --cached --quiet && echo 'No changes' && exit 0
          git commit -m 'feat(admin): clarify Cours & Historique controls'
          git push
