name: Wire public BRVM landing preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/landing-market-preview.yml'

permissions:
  contents: write

jobs:
  wire-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject landing assets
        shell: python
        run: |
          from pathlib import Path

          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')

          marker = 'tcLandingMarketPreview'
          if marker not in text:
              block = '''\n<!-- THE CAPITAL — Public BRVM market preview -->\n<section id="tcLandingMarketPreview" aria-label="Aperçu du marché BRVM"></section>\n<link rel="stylesheet" href="/css/landing-market-preview.css?v=20260831">\n<script src="/js/landing-market-preview.js?v=20260831" defer></script>\n'''
              if '</body>' not in text:
                  raise SystemExit('Cannot inject landing preview: </body> not found')
              text = text.replace('</body>', block + '</body>', 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit landing wiring and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/landing-market-preview.yml
          git add public/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(landing): show public BRVM market snapshot"
          git push
