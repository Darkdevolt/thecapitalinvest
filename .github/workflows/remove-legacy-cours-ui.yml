name: Remove legacy Cours UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'remove legacy Cours UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy Cours/History markup and loaders
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/admin.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n\s*<button class="admin-tab" onclick="switchTab\(\'historique\',this\)\">Historique</button>', '', s, count=1)
          start=s.find('    <div class="tab-panel" id="panel-historique">')
          end=s.find('    <div class="tab-panel" id="panel-entreprises">', start)
          if start != -1 and end != -1:
              s=s[:start]+s[end:]
          start=s.find('\n<div class="inline-edit" id="modal-historique">')
          end=s.find('\n<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">', start)
          if start != -1 and end != -1:
              s=s[:start]+s[end:]
          for tag in (
              '    <script src="admin/js/cours-control.js"></script>\n',
              '    <script src="admin/js/cours-control-enhanced.js"></script>\n',
              '    <script src="admin/js/cours-finalizer.js"></script>\n'
          ):
              s=s.replace(tag,'')
          center='    <script src="admin/js/cours-control-center.js"></script>\n'
          if center not in s:
              s=s.replace('</body>', center+'</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify legacy UI is gone
        run: |
          ! grep -q 'id="panel-historique"' public/admin.html
          ! grep -q "switchTab('historique'" public/admin.html
          ! grep -q 'id="modal-historique"' public/admin.html
          grep -q 'admin/js/cours-control-center.js' public/admin.html
      - name: Commit cleanup
        run: |
          git config user.name 'The Capital Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/admin.html
          git commit -m 'fix(admin): remove legacy Cours UI'
          git push
      - name: Delete one-shot workflow
        run: |
          git rm .github/workflows/remove-legacy-cours-ui.yml
          git commit -m 'chore(admin): remove cleanup workflow'
          git push
