name: Load Cours Control Center
on:
  push:
    branches: [main]
jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, 'ci(admin): load Cours control center') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject control center script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="admin/js/cours-control-center.js"></script>'
          if tag not in s:
              marker='<script src="admin/js/cours.js"></script>'
              if marker in s:
                  s=s.replace(marker, marker+'\n'+tag, 1)
              else:
                  s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit injection
        run: |
          git config user.name 'The Capital Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/admin.html
          git diff --cached --quiet || git commit -m 'ci(admin): load Cours control center'
          git push
