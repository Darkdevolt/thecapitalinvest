name: Temporary importer schema patch

on:
  push:
    paths:
      - '.github/workflows/tc-import-schema-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Patch import schema canonicalization
        shell: python
        run: |
          from pathlib import Path

          path = Path('public/admin/js/import.js')
          text = path.read_text(encoding='utf-8')

          old = """function sanitizeForInsert(row,table){var allowed=INSERT_COLUMNS[table];if(!allowed)throw new Error('Aucun schéma d’insertion déclaré pour '+table);var out={};Object.keys(row).forEach(function(k){if(k.indexOf('__')===0)return;if(allowed.has(k))out[k]=row[k];});return out;}\nasync function importDetails(details,table,unique,progressOffset,total,onProgress){var failed=[],n=0;for(var i=0;i<details.length;i+=BATCH_SIZE){var batchDetails=details.slice(i,i+BATCH_SIZE),batch=batchDetails.map(function(d){return sanitizeForInsert(d.row,table);}),batchNo=Math.floor(i/BATCH_SIZE)+1;try{await postBatch(table,batch,unique||null);n+=batch.length;}catch(e){failed.push({batch:batchNo,start:i,end:i+batch.length,rows:batchDetails,error:e&&e.message?e.message:String(e)});}var done=progressOffset+n;var p=total?Math.round(done/total*100):100;if(onProgress)onProgress(p,n,failed,batchNo,batch.length);if(batchNo%10===0)await new Promise(function(r){setTimeout(r,0);});}return{imported:n,failed:failed};}"""

          new = """var CANONICAL_INSERT_COLUMNS={\n historique:['ticker','date_seance','cloture','volume','variation','valeur_totale','cours_normal','volume_normal','cours_cloture','cours_ouverture','plus_haut','plus_bas','variation_pct'],\n entreprises:Array.from(INSERT_COLUMNS.entreprises),\n financials:Array.from(INSERT_COLUMNS.financials),\n dividendes_calendrier:Array.from(INSERT_COLUMNS.dividendes_calendrier),\n indices:Array.from(INSERT_COLUMNS.indices),\n actionnaires:Array.from(INSERT_COLUMNS.actionnaires)\n};\nfunction sanitizeForInsert(row,table){var allowed=INSERT_COLUMNS[table],canonical=CANONICAL_INSERT_COLUMNS[table];if(!allowed||!canonical)throw new Error('Aucun schéma d’insertion déclaré pour '+table);var out={};canonical.forEach(function(k){if(!allowed.has(k))throw new Error('Colonne '+k+' absente du schéma autorisé pour '+table);out[k]=Object.prototype.hasOwnProperty.call(row,k)?row[k]:null;});return out;}\nfunction assertBatchSchema(batch,table){var canonical=CANONICAL_INSERT_COLUMNS[table];if(!canonical||!batch.length)return;var expected=canonical.join('|');for(var i=0;i<batch.length;i++){var keys=Object.keys(batch[i]).join('|');if(keys!==expected)throw new Error('Schéma de lot incohérent pour '+table+' à la ligne '+(i+1));}}\nasync function importDetails(details,table,unique,progressOffset,total,onProgress){var failed=[],n=0;for(var i=0;i<details.length;i+=BATCH_SIZE){var batchDetails=details.slice(i,i+BATCH_SIZE),batch=batchDetails.map(function(d){return sanitizeForInsert(d.row,table);}),batchNo=Math.floor(i/BATCH_SIZE)+1;try{assertBatchSchema(batch,table);await postBatch(table,batch,unique||null);n+=batch.length;}catch(e){failed.push({batch:batchNo,start:i,end:i+batch.length,rows:batchDetails,error:e&&e.message?e.message:String(e)});}var done=progressOffset+n;var p=total?Math.round(done/total*100):100;if(onProgress)onProgress(p,n,failed,batchNo,batch.length);if(batchNo%10===0)await new Promise(function(r){setTimeout(r,0);});}return{imported:n,failed:failed};}"""

          if old not in text:
              raise SystemExit('Expected importer block not found; refusing to modify the file.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/admin/js/import.js
          git diff --cached --quiet || git commit -m "fix: canonicalize Excel import payload schemas"
          git push
