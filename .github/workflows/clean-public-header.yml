name: Clean public header line breaks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove literal injected line breaks
        run: |
          python3 <<'PY'
          from pathlib import Path
          for name in ['landing-v4.html','features.html','platform.html','about.html','contact.html']:
            p=Path('public')/name
            s=p.read_text(encoding='utf-8')
            s=s.replace('<link rel="stylesheet" href="/css/public-header.css">\\n</head>','<link rel="stylesheet" href="/css/public-header.css">\n</head>')
            s=s.replace('<div id="public-header"></div>\\n','<div id="public-header"></div>\n')
            s=s.replace('<script src="/js/public-header.js"></script>\\n</body>','<script src="/js/public-header.js"></script>\n</body>')
            p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/landing-v4.html public/features.html public/platform.html public/about.html public/contact.html
          git diff --cached --quiet && exit 0
          git commit -m "Clean public header markup"
          git push --force origin HEAD:${{ github.head_ref }}
