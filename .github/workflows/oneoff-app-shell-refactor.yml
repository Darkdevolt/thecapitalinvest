name: One-off app shell refactor

on:
  push:
    branches:
      - fix/app-shell-dashboard-20260904

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/app-shell-dashboard-20260904
          fetch-depth: 0

      - name: Apply refactor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          css = r'''/* The Capital — application shell hardening / layout compatibility layer.
             Loaded last intentionally: it normalises the existing CSS stack without deleting
             legacy rules that are still consumed by specialized views. */
          :root{
            --tc-shell-header:64px;
            --tc-shell-sidebar:252px;
            --tc-shell-gap:20px;
            --tc-shell-radius:14px;
          }
          *{box-sizing:border-box}
          html{scroll-behavior:smooth}
          body{min-width:320px;overflow-x:hidden}
          body.menu-open{overflow:hidden}

          .header{
            min-height:var(--tc-shell-header);
            height:auto;
            position:sticky;
            top:0;
            z-index:10000;
          }
          .topnav{min-width:0;overflow:visible}
          .topnav-logo,.sidebar-logo,.nav-dropdown-btn,.topnav-user,.topnav-logout{user-select:none}
          .topnav-right{min-width:0;gap:10px}
          .global-search{min-width:220px;max-width:420px;flex:1 1 320px}
          .global-search input{width:100%;min-width:0}
          .global-search-results{z-index:10060}

          .header-market-status{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;min-height:34px}
          .header-market-status .market-status-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.65;flex:0 0 auto}
          .header-market-status.tc-open .market-status-dot{opacity:1}
          .header-market-status.tc-closed .market-status-dot{opacity:.42}

          .sidebar{z-index:10020}
          .overlay{z-index:10010}
          .nav-dropdown-menu{z-index:10040}
          .tc-account-menu{z-index:10070}

          .main{min-width:0}
          .view{min-width:0}
          .page-header{margin-bottom:18px}
          .page-header h1{line-height:1.08;letter-spacing:-.02em}
          .page-header p{max-width:72ch}

          #view-overview #overviewStats{position:relative}
          #view-overview .stat-card{min-width:0;overflow:hidden}
          #view-overview .stat-value{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          #view-overview .grid-7030{align-items:stretch}
          #view-overview .grid-7030>.card{min-width:0}
          #view-overview .chart-container{min-width:0;max-width:100%}
          #view-overview canvas{max-width:100%}
          .tci-row{min-width:0}

          .tc-route-control:focus-visible,
          [data-route]:focus-visible,
          [data-dropdown]:focus-visible,
          .nav-dropdown-item:focus-visible,
          button:focus-visible,
          input:focus-visible,
          select:focus-visible{
            outline:2px solid var(--gold,#c7a15b);
            outline-offset:2px;
          }

          [data-tc-state]{position:relative;min-height:40px}
          [data-tc-state="loading"]::after{
            content:"Chargement…";
            display:block;
            padding:14px 16px;
            color:var(--muted,#777);
            font-size:12px;
          }
          [data-tc-state="empty"]::after{
            content:"Aucune donnée disponible.";
            display:block;
            padding:14px 16px;
            color:var(--muted,#777);
            font-size:12px;
          }
          [data-tc-state="error"]::after{
            content:"Impossible de charger ces données.";
            display:block;
            padding:14px 16px;
            color:var(--danger,#9a4a3a);
            font-size:12px;
          }
          [data-tc-state="stale"]::before{
            content:"Données potentiellement obsolètes";
            display:block;
            padding:6px 10px;
            margin-bottom:8px;
            border-left:2px solid currentColor;
            color:var(--muted,#777);
            font-size:10px;
            letter-spacing:.06em;
            text-transform:uppercase;
          }

          .tc-nav-icon{display:inline-flex!important;align-items:center;justify-content:center;width:16px;height:16px;flex:0 0 16px}
          .tc-nav-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
          .tc-ui-icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
          .nav-dropdown-btn .tc-nav-icon,.nav-item .tc-nav-icon{margin-right:7px}

          .mobile-menu-toggle{z-index:10030;flex:0 0 auto}

          @media (max-width:1200px){
            .topnav-right{gap:8px}
            .global-search{max-width:300px}
            .topnav-username{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          }
          @media (max-width:980px){
            .topnav{display:none}
            .header{display:flex;align-items:center;justify-content:space-between;padding-inline:12px}
            .topnav-right{width:100%;flex:1 1 auto}
            .global-search{order:1;max-width:none;flex:1 1 auto}
            .header-market-status{order:2}
            .header-time{order:3}
            .topnav-user{order:4}
            .topnav-logout{order:5}
            .global-search input{height:38px}
            .main{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
          }
          @media (max-width:768px){
            :root{--tc-shell-header:58px}
            .header{min-height:58px}
            .header-time{min-width:0;max-width:92px;overflow:hidden}
            .header-time .tc-clock-list{display:none!important}
            .header-time .tc-clock-kicker{display:none!important}
            .header-time .tc-clock-primary small{display:none!important}
            .header-time .tc-clock-primary{display:block!important}
            .header-market-status span:last-child{font-size:10px}
            .global-search{max-width:none}
            .main{padding-inline:12px!important}
            .page-header{margin-bottom:14px}
            .page-header h1{font-size:clamp(22px,6vw,30px)}
            #view-overview .grid-3,
            #view-overview .grid-7030{grid-template-columns:1fr!important}
            #view-overview .tci-row-2{grid-template-columns:1fr!important}
            #view-overview .grid-7030{gap:14px}
            .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
            table{min-width:640px}
            .nav-dropdown-menu{max-width:calc(100vw - 24px)}
          }
          @media (max-width:480px){
            .topnav-right{gap:6px}
            .topnav-user{min-width:34px}
            .topnav-username{display:none}
            .topnav-logout{width:34px}
            .header-market-status{display:none}
            .global-search input{font-size:13px}
            #view-overview .stat-card{padding:14px}
          }
          @media (prefers-reduced-motion:reduce){
            *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
          }
          '''
          (root/'public/app/css/shell-overhaul.css').write_text(css, encoding='utf-8')

          js = r'''/* The Capital — shell integration / defensive UX layer */
          (function (global) {
            'use strict';
            if (global.__TC_SHELL_OVERHAUL__) return;
            global.__TC_SHELL_OVERHAUL__ = true;

            var ICONS = {
              overview:'M3 11.5 12 4l9 7.5',
              titres:'M5 4h14v16H5z M8 8h8 M8 12h8 M8 16h5',
              marche:'M3 18h18 M5 15V9 M10 15V5 M15 15v-7 M20 15V6',
              boc:'M6 3h12v18H6z M9 7h6 M9 11h6 M9 15h4',
              analyses:'M4 19 9 13l4 3 7-10',
              comparison:'M7 7h11 M12 3l6 4-6 4 M17 17H6 M12 13l-6 4 6 4',
              'dividend-screener':'M12 3v18 M7 7h10 M7 17h10',
              'analyse-technique':'M4 18 9 13l3 3 8-9',
              'analyse-fondamentale':'M4 5h16v14H4z M8 9h8 M8 13h8 M8 17h5',
              screener:'M4 6h16 M4 12h11 M4 18h7 M18 12v6 M15 15h6',
              portefeuille:'M4 7h16v12H4z M8 7V5h8v2',
              alertes:'M6 18h12 M8 18V9a4 4 0 0 1 8 0v9 M10 21h4',
              financials:'M5 4h14v16H5z M8 8h8 M8 12h8 M8 16h8',
              publications:'M5 5h14v14H5z M8 3v4 M16 3v4 M8 11h8 M8 15h5',
              formation:'M4 5h16v12H4z M8 21h8 M12 17v4',
              fiche:'M5 4h14v16H5z M8 9h8 M8 13h8 M8 17h5',
              logout:'M10 6l6 6-6 6 M16 12H4 M19 5v14',
              settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M4 12h2 M18 12h2 M12 4v2 M12 18v2',
              account:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M5 21a7 7 0 0 1 14 0'
            };

            function svgPath(path) {
              return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="' + path + '"></path></svg>';
            }
            function putIcon(el, key, cls) {
              if (!el || !ICONS[key]) return;
              el.classList.add(cls || 'tc-nav-icon');
              el.setAttribute('aria-hidden','true');
              el.innerHTML = svgPath(ICONS[key]);
            }
            function routeKey(route) { return route === 'overview' ? 'overview' : route; }

            function normalizeIcons() {
              document.querySelectorAll('[data-route]').forEach(function (el) {
                var route = el.getAttribute('data-route');
                var holder = el.querySelector('.icon');
                if (holder && ICONS[routeKey(route)]) putIcon(holder, routeKey(route));
              });
              document.querySelectorAll('.nav-dropdown-btn').forEach(function (btn) {
                var route = btn.getAttribute('data-route');
                var drop = btn.getAttribute('data-dropdown');
                var key = route || (drop ? drop.replace(/^dd-/,'') : '');
                var span = btn.querySelector(':scope > span:first-child');
                if (span && ICONS[key]) putIcon(span, key);
              });
              var logout = document.querySelectorAll('[data-action="logout"]');
              logout.forEach(function (el) {
                if (el.querySelector('.tc-ui-icon')) return;
                var holder = document.createElement('span');
                holder.className='tc-ui-icon'; holder.setAttribute('aria-hidden','true'); holder.innerHTML=svgPath(ICONS.logout);
                el.textContent=''; el.appendChild(holder);
                if (el.classList.contains('logout-button')) { var txt=document.createElement('span'); txt.textContent='Déconnexion'; el.appendChild(txt); }
              });
              var admin = document.querySelector('#adminLink a');
              if (admin && !admin.querySelector('.tc-ui-icon')) {
                var a=document.createElement('span'); a.className='tc-ui-icon'; a.setAttribute('aria-hidden','true'); a.innerHTML=svgPath(ICONS.settings);
                admin.replaceChildren(a, document.createTextNode('Administration'));
              }
            }

            function normalizeRouteIds() {
              document.querySelectorAll('[data-route]').forEach(function (el) {
                var route=el.getAttribute('data-route');
                if (!route) return;
                if (!el.id) el.id='route-'+route;
                el.setAttribute('data-route-control','true');
                if (el.classList.contains('nav-item') || el.classList.contains('nav-dropdown-item')) {
                  if (!el.hasAttribute('role')) el.setAttribute('role','button');
                  if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
                }
              });
            }

            function closeSearch() {
              var r=document.getElementById('globalSearchResults'); if(r) r.classList.remove('open');
            }

            function enhanceSearch() {
              var input=document.getElementById('globalSearchInput');
              if(!input || input.dataset.tcEnhanced==='1') return;
              input.dataset.tcEnhanced='1';
              input.setAttribute('aria-autocomplete','list');
              input.setAttribute('enterkeyhint','search');
              var results=document.getElementById('globalSearchResults');
              if(results) results.setAttribute('aria-label','Résultats de recherche');
              input.addEventListener('keydown',function(e){
                if(!results || !results.classList.contains('open')) return;
                var items=Array.from(results.querySelectorAll('.gsr-item'));
                if(!items.length) return;
                var current=items.indexOf(document.activeElement);
                if(e.key==='ArrowDown'){ e.preventDefault(); (items[(current+1+items.length)%items.length]).focus(); }
                else if(e.key==='ArrowUp'){ e.preventDefault(); (items[(current-1+items.length)%items.length]).focus(); }
                else if(e.key==='Enter' && current>=0){ e.preventDefault(); items[current].click(); }
              });
              if(results){
                var obs=new MutationObserver(function(){
                  results.querySelectorAll('.gsr-item').forEach(function(item){
                    item.setAttribute('role','option');
                    item.setAttribute('tabindex','-1');
                  });
                });
                obs.observe(results,{childList:true,subtree:true});
              }
            }

            function setMarketHeader() {
              var host=document.getElementById('headerMarketStatus');
              var label=document.getElementById('headerMarketStatusText');
              if(!host || !label) return;
              var status=global.TC_MARKET_UX && typeof global.TC_MARKET_UX.getStatus==='function' ? global.TC_MARKET_UX.getStatus() : null;
              if(!status){ label.textContent='Marché'; return; }
              var labels={live:'Marché ouvert',preopen:'Pré-ouverture',preclose:'Pré-clôture',closed:'Marché fermé'};
              label.textContent=labels[status.code]||status.label||'Marché';
              host.classList.remove('tc-open','tc-closed');
              host.classList.add(status.code==='closed'?'tc-closed':'tc-open');
              host.title='État de la séance BRVM';
            }

            function watchClock() {
              var time=document.getElementById('headerTime');
              if(!time) return;
              time.setAttribute('aria-live','off');
            }

            function addStateWrappers() {
              ['tciPortfolio','tciBreadth','tciActivity','tciWatch','topMovers','recentActivity'].forEach(function(id){
                var el=document.getElementById(id); if(!el) return;
                el.setAttribute('data-tc-state','loading');
                if(el.dataset.tcStateObserver==='1') return;
                el.dataset.tcStateObserver='1';
                var obs=new MutationObserver(function(){
                  var text=(el.textContent||'').trim();
                  var hasRenderable=!!el.querySelector('table,tbody,tr,canvas,.card,.tci-card,[data-rendered],.empty-state,.error-state');
                  if(!text && !hasRenderable) el.setAttribute('data-tc-state','loading');
                  else if(/erreur|impossible|indisponible/i.test(text)) el.setAttribute('data-tc-state','error');
                  else if(/aucune donnée|aucun titre|aucune valeur/i.test(text)) el.setAttribute('data-tc-state','empty');
                  else el.setAttribute('data-tc-state','ready');
                });
                obs.observe(el,{subtree:true,childList:true,characterData:true});
              });
            }

            function monitorSession() {
              if(global.__TC_SESSION_MONITOR__) return;
              global.__TC_SESSION_MONITOR__=true;
              function valid(){
                var s=global.tcSession;
                var token=s && s.access_token;
                if(!token) return false;
                try{
                  var p=token.split('.')[1];
                  var normalized=p.replace(/-/g,'+').replace(/_/g,'/');
                  while(normalized.length%4) normalized+='=';
                  var payload=JSON.parse(atob(normalized));
                  return !!payload.exp && payload.exp*1000>Date.now();
                }catch(e){ return false; }
              }
              setInterval(function(){
                if(document.visibilityState==='hidden') return;
                if(!valid()){
                  try{localStorage.removeItem('tc_session');}catch(e){}
                  if(location.pathname!=='/login.html') location.replace('/login.html?expired=1');
                }
              },30000);
            }

            function shellBoot(){
              normalizeRouteIds();
              normalizeIcons();
              enhanceSearch();
              setMarketHeader();
              watchClock();
              addStateWrappers();
              monitorSession();
              if(global.TCHeader && typeof global.TCHeader.installAccountMenu==='function') global.TCHeader.installAccountMenu();
              if(global.TCHeader && typeof global.TCHeader.installAccountMenu==='function') setTimeout(global.TCHeader.installAccountMenu,120);
              setInterval(setMarketHeader,5000);
            }

            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',shellBoot,{once:true}); else shellBoot();
            global.TCShell={boot:shellBoot,refreshIcons:normalizeIcons,refreshMarketStatus:setMarketHeader};
          })(window);
          '''
          (root/'public/app/js/shell-overhaul.js').write_text(js, encoding='utf-8')

          app = root/'public/app/app.html'
          text = app.read_text(encoding='utf-8')
          anchor = '<link rel="stylesheet" href="/app/css/global-unified.css">'
          if '/app/css/shell-overhaul.css' not in text:
              text = text.replace(anchor, anchor + '\n<link rel="stylesheet" href="/app/css/shell-overhaul.css">', 1)
          script_anchor = '<script src="/app/js/init.js?v=8"></script>\n\n<script>\n(function(){'
          if '/app/js/shell-overhaul.js' not in text:
              text = text.replace(script_anchor, '<script src="/app/js/init.js?v=8"></script>\n<script src="/app/js/shell-overhaul.js"></script>\n\n<script>\n(function(){', 1)
          app.write_text(text, encoding='utf-8')

          router = root/'public/app/js/router.js'
          t = router.read_text(encoding='utf-8')
          old = "document.querySelectorAll('.nav-dropdown-item,.nav-dropdown-btn').forEach(el => el.classList.remove('active'));"
          new = "document.querySelectorAll('.nav-dropdown-item,.nav-dropdown-btn,[data-route]').forEach(el => el.classList.remove('active'));"
          t = t.replace(old,new)
          old2 = "const navEl = document.getElementById('nav-' + id);\n    if (navEl) navEl.classList.add('active');\n    const parentMenu = navEl?.closest('.nav-dropdown');"
          new2 = "const navEls = Array.from(document.querySelectorAll('[data-route=\\\"' + id + '\\\"]'));\n    navEls.forEach(el => el.classList.add('active'));\n    const navEl = document.getElementById('nav-' + id) || navEls.find(el => el.closest('.nav-dropdown')) || navEls[0];\n    const parentMenu = navEl?.closest('.nav-dropdown');"
          if old2 in t: t=t.replace(old2,new2)
          old3 = "bc.innerHTML=items.map((item,i)=>i===items.length-1?`<span class=\\\"bc-current\\\">${escapeHtml(item.label)}</span>`:`<a href=\\\"#${item.view}\\\" onclick=\\\"nav('${item.view}');return false;\\\">${escapeHtml(item.label)}</a><span class=\\\"bc-sep\\\">›</span>`).join('');"
          new3 = "bc.innerHTML=items.map((item,i)=>i===items.length-1?`<span class=\\\"bc-current\\\">${escapeHtml(item.label)}</span>`:`<a href=\\\"#${item.view}\\\" data-route=\\\"${escapeHtml(item.view)}\\\">${escapeHtml(item.label)}</a><span class=\\\"bc-sep\\\">›</span>`).join('');"
          if old3 in t:t=t.replace(old3,new3)
          router.write_text(t,encoding='utf-8')

          search = root/'public/app/js/search.js'
          st = search.read_text(encoding='utf-8')
          st = st.replace("<div class=\\\"gsr-item\\\" onclick=\\\"openFiche('${c.ticker}','overview'); document.getElementById('globalSearchResults').classList.remove('open'); document.getElementById('globalSearchInput').value='';\\\">", "<button type=\\\"button\\\" class=\\\"gsr-item\\\" data-tc-search-ticker=\\\"${String(c.ticker || '').replace(/\\\"/g,'&quot;')}\\\">")
          st = st.replace("      </div>\\n    \\`;<\/", "      </button>\\n    \\`;</")
          # The targeted replacement above can be brittle because of template literals; perform a safer whole-block replacement when present.
          block = re.compile(r"results\\.innerHTML = matches\\.map\\(c => \\{.*?results\\.classList\.add\\('open'\\);", re.S)
          replacement = r'''results.innerHTML = matches.map(c => {
        const name = entMap[c.ticker]?.nom || c.ticker;
        const sector = getSector(c.ticker);
        const ticker = String(c.ticker || '').replace(/[^A-Za-z0-9._-]/g, '');
        const safeName = String(name || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        const safeSector = String(sector || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        return `<button type="button" class="gsr-item" data-tc-search-ticker="${ticker}" role="option">
          <span><span class="gsr-ticker">${ticker}</span><span class="gsr-name">${safeName}</span></span>
          <span class="gsr-sector">${safeSector}</span>
        </button>`;
      }).join('');
    results.classList.add('open');
    results.querySelectorAll('[data-tc-search-ticker]').forEach(item => item.addEventListener('click', () => {
      const ticker = item.getAttribute('data-tc-search-ticker');
      if (ticker && typeof openFiche === 'function') openFiche(ticker, 'overview');
      results.classList.remove('open');
      input.value = '';
      input.focus();
    }));'''
          st2, n = block.subn(replacement, st)
          if n: st=st2
          search.write_text(st,encoding='utf-8')

          # Make account/menu symbols SVG-capable through shell-overhaul without changing navigation semantics.
          header = root/'public/app/js/components/header.js'
          ht=header.read_text(encoding='utf-8')
          ht=ht.replace("'<span>\\u25C9</span><div><b>Informations</b>'", "'<span class=\"tc-account-icon\" aria-hidden=\"true\"></span><div><b>Informations</b>'")
          ht=ht.replace("'<span>\\u2699</span><div><b>Préférences</b>'", "'<span class=\"tc-account-icon\" aria-hidden=\"true\"></span><div><b>Préférences</b>'")
          ht=ht.replace("'<span>\\u25C7</span><div><b>Sécurité</b>'", "'<span class=\"tc-account-icon\" aria-hidden=\"true\"></span><div><b>Sécurité</b>'")
          ht=ht.replace("'<span>\\u25A3</span><div><b>Abonnement</b>'", "'<span class=\"tc-account-icon\" aria-hidden=\"true\"></span><div><b>Abonnement</b>'")
          ht=ht.replace("'<span>\\u2600</span> Apparence <strong>Sombre</strong>'", "'<span class=\"tc-account-icon\" aria-hidden=\"true\"></span> Apparence <strong>Sombre</strong>'")
          header.write_text(ht,encoding='utf-8')

          print('Refactor applied')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name "The Capital Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app/app.html public/app/css/shell-overhaul.css public/app/js/shell-overhaul.js public/app/js/router.js public/app/js/search.js public/app/js/components/header.js
          git diff --cached --check
          git commit -m "fix: harden app shell navigation header dashboard"
          git push origin HEAD:fix/app-shell-dashboard-20260904

      - name: Remove one-off runner
        shell: bash
        run: |
          rm -f .github/workflows/oneoff-app-shell-refactor.yml
          git add -u .github/workflows/oneoff-app-shell-refactor.yml
          git commit -m "chore: remove one-off refactor runner"
          git push origin HEAD:fix/app-shell-dashboard-20260904
