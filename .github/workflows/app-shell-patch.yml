name: Apply app shell patch
on:
  push:
    branches: [fix/app-shell-dashboard-20260904]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-shell-dashboard-20260904
          fetch-depth: 0
      - name: Patch files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/app/app.html')
          s=p.read_text()
          a='<link rel="stylesheet" href="/app/css/global-unified.css">'
          if '/app/css/shell-overhaul.css' not in s: s=s.replace(a,a+'\n<link rel="stylesheet" href="/app/css/shell-overhaul.css">',1)
          a='<script src="/app/js/init.js?v=8"></script>\n\n<script>'
          if '/app/js/shell-overhaul.js' not in s: s=s.replace(a,'<script src="/app/js/init.js?v=8"></script>\n<script src="/app/js/shell-overhaul.js"></script>\n\n<script>',1)
          p.write_text(s)
          r=Path('public/app/js/router.js'); s=r.read_text()
          s=s.replace("document.querySelectorAll('.nav-dropdown-item,.nav-dropdown-btn').forEach(el => el.classList.remove('active'));","document.querySelectorAll('.nav-dropdown-item,.nav-dropdown-btn,[data-route]').forEach(el => el.classList.remove('active'));")
          s=s.replace("const navEl = document.getElementById('nav-' + id);\n    if (navEl) navEl.classList.add('active');\n    const parentMenu = navEl?.closest('.nav-dropdown');","const navEls = Array.from(document.querySelectorAll('[data-route=\\\"' + id + '\\\"]'));\n    navEls.forEach(el => el.classList.add('active'));\n    const navEl = document.getElementById('nav-' + id) || navEls.find(el => el.closest('.nav-dropdown')) || navEls[0];\n    const parentMenu = navEl?.closest('.nav-dropdown');")
          s=s.replace("`<a href=\\\"#${item.view}\\\" onclick=\\\"nav('${item.view}');return false;\\\">${escapeHtml(item.label)}</a><span class=\\\"bc-sep\\\">›</span>`","`<a href=\\\"#${item.view}\\\" data-route=\\\"${escapeHtml(item.view)}\\\">${escapeHtml(item.label)}</a><span class=\\\"bc-sep\\\">›</span>`")
          r.write_text(s)
          h=Path('public/app/js/components/header.js'); s=h.read_text()
          needle="    loadStyle('/app/css/visual-contrast.css', 'data-tc-visual-contrast');"
          if "shell-overhaul.css" not in s: s=s.replace(needle,needle+"\n    loadStyle('/app/css/shell-overhaul.css', 'data-tc-shell-overhaul');\n    loadScript('/app/js/shell-overhaul.js');")
          h.write_text(s)
          print('patched')
          PY
      - name: Commit changes
        run: |
          git config user.name "The Capital Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app/app.html public/app/js/router.js public/app/js/components/header.js
          git diff --cached --check
          git commit -m "fix: wire canonical app shell and navigation"
          git push origin HEAD:fix/app-shell-dashboard-20260904
