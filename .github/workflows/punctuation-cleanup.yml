name: punctuation-cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace long dashes in user-facing application text
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          targets = [
            Path('public/landing-v4.html'), Path('public/features.html'), Path('public/platform.html'),
            Path('public/about.html'), Path('public/contact.html'), Path('public/app/app.html'),
            Path('api/capital-ai.js'), Path('public/js/public-header.js')
          ]
          targets += list(Path('public/app/js').rglob('*.js'))
          targets = list(dict.fromkeys(p for p in targets if p.exists()))
          report=[]
          changed=False
          for p in targets:
            s=p.read_text(encoding='utf-8')
            before_em=s.count('—'); before_en=s.count('–')
            if not (before_em or before_en):
              continue
            def repl(m):
              left,right=m.group(1),m.group(2)
              if left[-1:].isdigit() and right[:1].isdigit(): return left+' à '+right
              return left+', '+right
            n=re.sub(r'(\S)\s*[—–]\s*(\S)', repl, s)
            n=n.replace('—', ', ').replace('–', ', ')
            if n!=s:
              p.write_text(n,encoding='utf-8'); changed=True
              report.append(f'{p}: em={before_em}, en={before_en}, total={before_em+before_en}')
          Path('punctuation-report.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          if changed:
            print('\n'.join(report))
          else:
            print('No long dashes found in targeted files.')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/landing-v4.html public/features.html public/platform.html public/about.html public/contact.html public/app/app.html public/js/public-header.js public/app/js api/capital-ai.js punctuation-report.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove long dashes from interface text"
          git push
