name: Activate unified dashboard styles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link unified dashboard stylesheet
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/app/app.html')
          s = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="/app/css/dashboard-unified.css">'
          marker = '<link rel="stylesheet" href="/app/css/marche.css">'
          if link not in s and marker in s:
              s = s.replace(marker, marker + '\n' + link, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app/app.html
          git diff --cached --quiet && exit 0
          git commit -m "style: activate unified dashboard layer"
          git push
