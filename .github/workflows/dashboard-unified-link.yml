name: Activate unified dashboard styles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link unified dashboard stylesheets
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/app/app.html')
          s = p.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="/app/css/marche.css">'
          links = [
              '<link rel="stylesheet" href="/app/css/dashboard-unified.css">',
              '<link rel="stylesheet" href="/app/css/global-unified.css">',
          ]
          if marker in s:
              missing = [x for x in links if x not in s]
              if missing:
                  s = s.replace(marker, marker + '\n' + '\n'.join(missing), 1)
                  p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app/app.html
          git diff --cached --quiet && exit 0
          git commit -m "style: unify The Capital dashboard views"
          git push
