name: Consolidate public marketing header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared public header
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('public')
          pages = ['landing-v4.html','features.html','platform.html','about.html','contact.html']

          js = r'''(() => {
            const path = window.location.pathname.replace(/\\/+$/, '') || '/';
            const page = path.endsWith('/features.html') ? 'features' :
              path.endsWith('/platform.html') ? 'platform' :
              path.endsWith('/about.html') ? 'about' :
              path.endsWith('/contact.html') ? 'contact' : 'home';
            const links = [
              ['ACCUEIL','/','home'],
              ['SOLUTION','/#solution',''],
              ['USAGES','/#usages',''],
              ['FONCTIONNALITÉS','/features.html','features'],
              ['TARIFS','/pricing.html',''],
              ['À PROPOS','/about.html','about'],
              ['CONTACT','/contact.html','contact']
            ];
            const host = document.getElementById('public-header');
            if (!host) return;
            host.innerHTML = `<header class="public-header"><div class="public-header__inner">
              <a class="public-header__brand" href="/" aria-label="The Capital — Accueil"><img src="/assets/the-capital-logo.png" alt="The Capital"></a>
              <button class="public-header__menu" type="button" aria-label="Ouvrir le menu" aria-expanded="false"><span></span><span></span><span></span></button>
              <nav class="public-header__nav" aria-label="Navigation principale">${links.map(([label,href,key]) => `<a href="${href}" class="${page === key ? 'is-active' : ''}">${label}</a>`).join('')}</nav>
              <div class="public-header__actions"><a class="public-header__login" href="/login.html">CONNEXION</a><a class="public-header__register" href="/register.html">CRÉER UN COMPTE</a></div>
            </div><div class="public-header__mobile" hidden>${links.map(([label,href,key]) => `<a href="${href}" class="${page === key ? 'is-active' : ''}">${label}</a>`).join('')}<div class="public-header__mobile-actions"><a class="public-header__login" href="/login.html">CONNEXION</a><a class="public-header__register" href="/register.html">CRÉER UN COMPTE</a></div></div></header>`;
            const button = host.querySelector('.public-header__menu');
            const mobile = host.querySelector('.public-header__mobile');
            button.addEventListener('click', () => { const open = button.getAttribute('aria-expanded') === 'true'; button.setAttribute('aria-expanded', String(!open)); mobile.hidden = open; });
            mobile.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { button.setAttribute('aria-expanded','false'); mobile.hidden = true; }));
          })();
          '''
          css = r'''.public-header{position:sticky;top:0;z-index:1000;background:rgba(9,8,6,.94);border-bottom:1px solid rgba(184,150,78,.18);backdrop-filter:blur(14px);font-family:'DM Sans',Arial,sans-serif}.public-header__inner{width:min(1240px,calc(100% - 40px));height:76px;margin:auto;display:flex;align-items:center;gap:28px}.public-header__brand{display:flex;align-items:center;width:76px;height:54px;flex:0 0 76px}.public-header__brand img{width:54px;height:54px;object-fit:contain;object-position:center;display:block}.public-header__nav{display:flex;align-items:center;justify-content:center;gap:22px;flex:1}.public-header__nav a,.public-header__login,.public-header__register{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;white-space:nowrap}.public-header__nav a{color:rgba(245,240,232,.62);padding:28px 0 25px;border-bottom:2px solid transparent}.public-header__nav a:hover,.public-header__nav a.is-active{color:#f5f0e8}.public-header__nav a.is-active{border-bottom-color:#b8964e}.public-header__actions{display:flex;align-items:center;gap:10px}.public-header__login{color:#f5f0e8;padding:12px 14px}.public-header__register{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;background:#b8964e;border:1px solid #b8964e;color:#0a0804}.public-header__register:hover{background:#d4af6a;border-color:#d4af6a}.public-header__menu{display:none;margin-left:auto;width:42px;height:40px;background:none;border:1px solid rgba(184,150,78,.28);cursor:pointer}.public-header__menu span{display:block;width:18px;height:1px;background:#f5f0e8;margin:4px auto}.public-header__mobile{display:none}.public-header__mobile-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.public-header__mobile .public-header__login,.public-header__mobile .public-header__register{display:inline-flex;align-items:center;justify-content:center}.public-header__mobile .public-header__login{border:1px solid rgba(184,150,78,.28)}@media(max-width:1100px){.public-header__inner{gap:16px}.public-header__nav{gap:14px}.public-header__nav a{font-size:9px}.public-header__actions{gap:4px}.public-header__login{padding:10px 8px}.public-header__register{padding:0 10px;font-size:9px}}@media(max-width:768px){.public-header__inner{height:64px;width:min(100% - 28px,1240px)}.public-header__brand{width:58px;height:48px;flex-basis:58px}.public-header__brand img{width:46px;height:46px}.public-header__nav,.public-header__actions{display:none}.public-header__menu{display:block}.public-header__mobile{position:absolute;left:0;right:0;top:64px;background:#090806;border-bottom:1px solid rgba(184,150,78,.18);padding:12px 14px 18px}.public-header__mobile[hidden]{display:none}.public-header__mobile>a{display:block;color:rgba(245,240,232,.68);padding:12px 8px;border-bottom:1px solid rgba(184,150,78,.10);font:500 10px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}.public-header__mobile>a.is-active{color:#f5f0e8;border-left:2px solid #b8964e;padding-left:10px}.public-header__mobile-actions .public-header__login,.public-header__mobile-actions .public-header__register{min-height:40px;padding:0 14px}.public-header__mobile-actions .public-header__register{background:#b8964e;color:#0a0804}}'''

          (root/'js').mkdir(exist_ok=True)
          (root/'css').mkdir(exist_ok=True)
          (root/'js/public-header.js').write_text(js, encoding='utf-8')
          (root/'css/public-header.css').write_text(css, encoding='utf-8')

          for name in pages:
              p = root/name
              s = p.read_text(encoding='utf-8')
              # Remove legacy desktop header and mobile menu blocks.
              s = re.sub(r'<header(?:\s[^>]*)?>.*?</header>\s*', '', s, count=1, flags=re.I|re.S)
              s = re.sub(r'<div\s+class="mobile-menu"[^>]*>.*?</div>\s*', '', s, count=1, flags=re.I|re.S)
              # Remove any previous shared header placeholders/scripts/styles so the transformation is idempotent.
              s = re.sub(r'<div\s+id="public-header"[^>]*>.*?</div>\s*', '', s, count=1, flags=re.I|re.S)
              s = re.sub(r'\s*<link\s+rel="stylesheet"\s+href="/css/public-header\.css">', '', s, flags=re.I)
              s = re.sub(r'\s*<script\s+src="/js/public-header\.js"></script>', '', s, flags=re.I)
              s = s.replace('</head>', '  <link rel="stylesheet" href="/css/public-header.css">\n</head>', 1)
              s = s.replace('<body>', '<body>\n<div id="public-header"></div>', 1)
              s = s.replace('</body>', '  <script src="/js/public-header.js"></script>\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit consolidated public header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/landing-v4.html public/features.html public/platform.html public/about.html public/contact.html public/css/public-header.css public/js/public-header.js
          git diff --cached --quiet && exit 0
          git commit -m "Unify public marketing header"
          git push
