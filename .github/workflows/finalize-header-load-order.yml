name: Finalize public header load order
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move shared header script before page scripts
        run: |
          python3 <<'PY'
          from pathlib import Path
          for name in ['landing-v4.html','features.html','platform.html','about.html','contact.html']:
            p=Path('public')/name
            s=p.read_text(encoding='utf-8')
            s=s.replace('<div id="public-header"></div>\n','<div id="public-header"></div>\n<script src="/js/public-header.js"></script>\n',1)
            s=s.replace('<script src="/js/public-header.js"></script>\n</body>','</body>',1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/landing-v4.html public/features.html public/platform.html public/about.html public/contact.html
          git diff --cached --quiet && exit 0
          git commit -m "Load shared public header before page scripts"
          git push --force origin HEAD:${{ github.head_ref }}
