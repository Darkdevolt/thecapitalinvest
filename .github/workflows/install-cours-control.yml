name: Install BRVM course control center

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[cours-control-installed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire control center assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/admin.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="admin/css/cours-control.css">'
          css2='<link rel="stylesheet" href="admin/css/cours-control-enhanced.css">'
          js='<script src="admin/js/cours-control.js"></script>'
          js2='<script src="admin/js/cours-control-enhanced.js"></script>'
          if css not in s:
              s=s.replace('</head>', '    '+css+'\n</head>', 1)
          if css2 not in s:
              s=s.replace('</head>', '    '+css2+'\n</head>', 1)
          if js not in s:
              s=s.replace('</body>', '    '+js+'\n</body>', 1)
          if js2 not in s:
              s=s.replace('</body>', '    '+js2+'\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(admin): wire BRVM quality cockpit [cours-control-installed]"
          git push
