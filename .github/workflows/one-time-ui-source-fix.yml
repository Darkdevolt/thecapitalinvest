name: One-time UI source fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: apply mobile navigation and hero logo directly to sources'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source-level UI fixes
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          root = Path('public')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          if "fetch('/api/marche?type=cours')" not in text:
              raise SystemExit('Ticker API call not found; refusing to modify index.html')
          if 'assets/the-capital-logo.png' not in text:
              raise SystemExit('Official logo asset not found; refusing to modify index.html')
          if 'id="the-capital-hero-logo-fix"' not in text:
              css = '''\n<style id="the-capital-hero-logo-fix">\n.hero-circle-inner{width:88% !important;height:88% !important;display:flex !important;align-items:center !important;justify-content:center !important;}\n.hero-circle-inner img{display:block !important;width:100% !important;height:100% !important;max-width:none !important;max-height:none !important;object-fit:contain !important;object-position:center !important;}\n@media (max-width:900px){.hero-circle-inner{width:88% !important;height:88% !important}.hero-circle-inner img{width:100% !important;height:100% !important;max-width:none !important;max-height:none !important}}\n@media (max-width:480px){.hero-circle-inner{width:86% !important;height:86% !important}.hero-circle-inner img{width:100% !important;height:100% !important}}\n</style>\n'''
              if '</head>' not in text:
                  raise SystemExit('Missing </head> in index.html')
              index.write_text(text.replace('</head>', css + '</head>', 1), encoding='utf-8')

          touched = []
          for path in sorted(root.glob('*.html')):
              if path.name in {'index.html', 'app.html'}:
                  continue
              html = path.read_text(encoding='utf-8')
              if 'id="hamburger"' not in html or 'id="mobile-menu"' not in html:
                  continue
              changed = False
              if 'class="public-secondary-page"' not in html:
                  html = html.replace('<body>', '<body class="public-secondary-page">', 1)
                  changed = True
              if 'js/mobile-nav.js' not in html:
                  if '</body>' not in html:
                      raise SystemExit(f'Missing </body> in {path}')
                  html = html.replace('</body>', '  <script src="js/mobile-nav.js" defer></script>\n\n</body>', 1)
                  changed = True
              if changed:
                  path.write_text(html, encoding='utf-8')
              touched.append(str(path))
          if not touched:
              raise SystemExit('No secondary page with the expected existing mobile menu was found')

          style = root / 'style.css'
          css = style.read_text(encoding='utf-8')
          marker = '/* THE CAPITAL — DIRECT MOBILE NAV SOURCE FIX */'
          if marker not in css:
              css += '''\n\n/* THE CAPITAL — DIRECT MOBILE NAV SOURCE FIX */\nbody.public-secondary-page.menu-open{overflow:hidden}\n@media (max-width:900px){\n  body.public-secondary-page header,body.public-secondary-page header.scrolled{padding-left:16px;padding-right:16px;padding-top:max(10px,env(safe-area-inset-top));padding-bottom:10px;min-height:64px}\n  body.public-secondary-page .hamburger{display:flex;width:48px;height:48px;min-width:48px;flex:0 0 48px;align-items:center;justify-content:center;padding:0;gap:5px;border:1px solid var(--border);border-radius:10px;background:rgba(17,16,9,.88);position:relative;z-index:102;-webkit-tap-highlight-color:transparent;touch-action:manipulation}\n  body.public-secondary-page .hamburger span{width:20px}\n  body.public-secondary-page .mobile-menu{display:flex;position:fixed;top:calc(64px + env(safe-area-inset-top));left:8px;right:8px;max-height:calc(100svh - 76px - env(safe-area-inset-top));overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px;background:rgba(10,8,4,.98);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.55);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-8px);transition:opacity .2s ease,transform .2s ease,visibility .2s ease;z-index:101}\n  body.public-secondary-page .mobile-menu.open{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0)}\n  body.public-secondary-page .mobile-menu a{display:flex;align-items:center;min-height:48px;padding:12px 14px;border:0;border-radius:9px;color:var(--cream);text-decoration:none;font-size:12px;letter-spacing:.1em;text-transform:uppercase;-webkit-tap-highlight-color:transparent;touch-action:manipulation}\n  body.public-secondary-page .mobile-menu a:hover,body.public-secondary-page .mobile-menu a:active,body.public-secondary-page .mobile-menu a.active{color:var(--gold);background:rgba(184,150,78,.07)}\n  body.public-secondary-page .mobile-menu .nav-cta{margin:6px 0 0;justify-content:center;background:var(--gold)!important;color:var(--bg)!important;font-weight:500!important}\n}\n@media (max-width:360px){body.public-secondary-page .mobile-menu{left:6px;right:6px}}\n'''
              style.write_text(css, encoding='utf-8')

          status = subprocess.check_output(['git','status','--short'], text=True)
          for line in status.splitlines():
              if '/api/' in line or 'public/app/js/views/portefeuille-' in line or 'public/app/js/views/portfolio-' in line:
                  raise SystemExit(f'Forbidden file changed: {line}')
          print(status)

      - name: Commit direct source changes and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/the-capital-logo.png
          grep -q "fetch('/api/marche?type=cours')" public/index.html
          grep -q 'id="the-capital-hero-logo-fix"' public/index.html
          grep -q 'THE CAPITAL — DIRECT MOBILE NAV SOURCE FIX' public/style.css
          git config user.name 'The Capital Engineering Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html public/style.css public/*.html
          git add -u public/*.html
          git rm .github/workflows/one-time-ui-source-fix.yml
          git commit -m 'fix: apply mobile navigation and hero logo directly to sources'
          git push origin HEAD:main
