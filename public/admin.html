<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — The Capital</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/the-capital-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css?v=2026082201">
</head>
<body>

<!-- Écran de démarrage : vérification de session puis des droits -->
<div id="boot">
    <img src="/assets/the-capital-logo.png" alt="">
    <div class="wordmark">THE <span>·</span> CAPITAL</div>
    <div class="spinner"></div>
    <p id="boot-msg">Vérification de la session…</p>
</div>

<div id="shell" hidden>

    <header class="topbar">
        <button class="rail-toggle" id="rail-toggle" aria-label="Afficher le menu">☰</button>

        <a class="brand" href="/index.html">
            <img src="/assets/the-capital-logo.png" alt="The Capital">
            <span>
                <span class="brand-text">THE <span>·</span> CAPITAL</span>
                <span class="brand-sub">Poste d'administration</span>
            </span>
        </a>

        <!-- Contrôle de santé permanent : le diagnostic vit dans l'interface,
             pas dans une page à part. Un clic ouvre le détail. -->
        <button class="health-chip" id="health-chip" title="Ouvrir le diagnostic de la base">
            <span class="health-dot busy" id="health-dot"></span>
            <span class="health-text" id="health-text">Contrôle de la base…</span>
        </button>

        <div class="topbar-right">
            <button class="kbd-hint" id="palette-open" title="Aller à une section">⌘K</button>
            <span class="admin-badge">Admin</span>
            <span class="topbar-user" id="who"></span>
            <button class="btn btn-outline btn-sm" id="logout">Déconnexion</button>
        </div>
    </header>

    <nav class="rail" id="rail" aria-label="Sections d'administration">
        <div id="rail-groups"></div>
        <div class="rail-foot">
            <button class="btn btn-outline btn-sm" id="refresh-all">↺ Tout recharger</button>
        </div>
    </nav>

    <main class="stage" id="stage"></main>

</div>

<div id="toasts" aria-live="polite"></div>

<div id="palette">
    <div class="palette-box">
        <input type="text" id="palette-input" placeholder="Aller à…" autocomplete="off" spellcheck="false">
        <div class="palette-list" id="palette-list"></div>
    </div>
</div>

<!-- Fenêtre modale générique : le contenu est injecté par chaque module -->
<div class="overlay" id="modal-host">
    <div class="modal">
        <div class="modal-head">
            <div class="modal-title" id="modal-title">—</div>
            <div class="modal-sub" id="modal-sub"></div>
        </div>
        <div id="modal-body"></div>
        <div class="modal-foot">
            <span class="msg" id="modal-msg"></span>
            <button class="btn btn-outline btn-sm" id="modal-cancel">Annuler</button>
            <button class="btn btn-primary btn-sm" id="modal-save">Enregistrer</button>
        </div>
    </div>
</div>

<!-- SheetJS est chargé en arrière-plan : une panne/latence du CDN ne doit jamais
     bloquer le chargement de tout l'espace d'administration. Les fonctions Excel
     vérifient elles-mêmes la présence de XLSX au moment de leur utilisation. -->
<script>
(function () {
    var script = document.createElement('script');
    script.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
    script.async = true;
    script.onerror = function () {
        console.warn('[TC] Moteur Excel indisponible : le reste de l’administration reste accessible.');
    };
    document.head.appendChild(script);
})();
</script>

<script src="/js/env.js"></script>
<script src="/admin/js/core/config.js?v=2026082201"></script>
<script src="/admin/js/core/utils.js?v=2026082201"></script>
<script src="/admin/js/core/api.js?v=2026082201"></script>
<script src="/admin/js/core/app.js?v=2026082201"></script>

<script src="/admin/js/modules/dashboard.js?v=2026082201"></script>
<script src="/admin/js/modules/cours.js?v=2026082201"></script>
<script src="/admin/js/modules/indices.js?v=2026082201"></script>
<script src="/admin/js/modules/scraper.js?v=2026082201"></script>
<script src="/admin/js/modules/boc.js?v=2026082201"></script>
<script src="/admin/js/modules/entreprises.js?v=2026082201"></script>
<script src="/admin/js/financials/financials-schema.js?v=2026082201"></script>
<script src="/admin/js/financials/financials-excel.js?v=2026082201"></script>
<script src="/admin/js/modules/financials.js?v=2026082201"></script>
<script src="/admin/js/modules/dividendes.js?v=2026082201"></script>
<script src="/admin/js/modules/analyses.js?v=2026082201"></script>
<script src="/admin/js/modules/reporting.js?v=2026082201"></script>
<script src="/admin/js/modules/utilisateurs.js?v=2026082201"></script>
<script src="/admin/js/modules/import.js?v=2026082201"></script>
<script src="/admin/js/modules/diagnostic.js?v=2026082201"></script>

<script>TC.boot();</script>
</body>
</html>
