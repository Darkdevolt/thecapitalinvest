<script>
(function(){
    function reportButton(){
        var b=document.createElement('button');
        b.className='btn btn-outline btn-sm'; b.textContent='Télécharger le rapport technique';
        b.onclick=function(){ if(window.TC_DIAG) TC_DIAG.download(); };
        return b;
    }
    function fatal(title, detail){
        var boot=document.getElementById('boot'); if(!boot)return;
        boot.innerHTML='<img src="/assets/the-capital-logo.png" alt=""><div class="fatal"><h2>'+String(title).replace(/[<>]/g,'')+'</h2><p>'+String(detail).replace(/[<>]/g,'')+'</p><div class="boot-actions"></div></div>';
        boot.hidden=false; document.getElementById('shell').hidden=true;
        var actions=boot.querySelector('.boot-actions');
        actions.appendChild(reportButton());
        var reload=document.createElement('button'); reload.className='btn btn-primary btn-sm'; reload.textContent='Réessayer'; reload.onclick=function(){location.reload();}; actions.appendChild(reload);
        if(window.TC_DIAG) TC_DIAG.push('boot-fatal',title,detail);
    }
    if(window.TC_DIAG) TC_DIAG.mark('admin-scripts-loaded');
    if(!window.TC || typeof TC.boot!=='function') { fatal('Démarrage impossible','Le noyau JavaScript de l’administration n’a pas pu être chargé.'); return; }
    var originalBoot=TC.boot;
    var finished=false, aborted=false;
    var shell=document.getElementById('shell');
    var observer=new MutationObserver(function(){ if(aborted && !shell.hidden) shell.hidden=true; });
    observer.observe(shell,{attributes:true,attributeFilter:['hidden']});
    TC.boot=async function(){
        if(window.TC_DIAG) TC_DIAG.mark('boot-start');
        var work;
        try { work=Promise.resolve(originalBoot()); }
        catch(e){ work=Promise.reject(e); }
        var watchdog=new Promise(function(_,reject){setTimeout(function(){reject(new Error('Le démarrage dépasse 12 secondes. Une requête ou un module ne répond probablement pas.'));},12000);});
        try {
            await Promise.race([work,watchdog]);
            finished=true;
            if(window.TC_DIAG) TC_DIAG.mark('boot-finished');
        } catch(e){
            if(finished)return;
            aborted=true;
            if(window.TC_DIAG) TC_DIAG.push('boot-timeout',e.message);
            fatal('Démarrage interrompu',e.message+' Aucun chargement ne continuera à bloquer cette page.');
        }
    };
    TC.boot();
})();
</script>
