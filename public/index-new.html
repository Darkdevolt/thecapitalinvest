<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080705">
  <title>The Capital — Intelligence financière africaine</title>
  <meta name="description" content="The Capital — Comprendre le marché. Décider avec clarté.">
  <style>
    :root{
      --capital-home-bg:none;
      --gold:#e0b96f;
      --white:#f7f3ec;
      --line:rgba(224,185,111,.55);
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080705}
    body{font-family:Arial,Helvetica,sans-serif;color:var(--white)}
    .home{
      position:relative;width:100vw;height:100svh;min-height:620px;
      background:#080705;
      isolation:isolate;
    }
    .home::before{
      content:"";position:absolute;inset:0;z-index:-2;
      background-image:var(--capital-home-bg);
      background-size:cover;background-position:center center;background-repeat:no-repeat;
      transform:scale(1.001);
    }
    .home::after{
      content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
      background:linear-gradient(90deg,rgba(4,4,3,.06),rgba(4,4,3,0) 55%,rgba(4,4,3,.08));
    }
    .fallback::before{
      background:
        radial-gradient(circle at 76% 20%,rgba(224,185,111,.16),transparent 30%),
        linear-gradient(120deg,#0b0907,#15110b 55%,#080705);
    }
    .hit{position:absolute;display:block;z-index:5;outline:none;border-radius:4px}
    .hit:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
    .home-hit{left:3.9%;top:2%;width:17.5%;height:6.5%}
    .nav-accueil{left:30.8%;top:1.4%;width:5.5%;height:5.5%}
    .nav-marches{left:36.7%;top:1.4%;width:5.5%;height:5.5%}
    .nav-analyses{left:42.7%;top:1.4%;width:6%;height:5.5%}
    .nav-actualites{left:49.1%;top:1.4%;width:6%;height:5.5%}
    .nav-about{left:55.5%;top:1.4%;width:6%;height:5.5%}
    .nav-search{left:75.5%;top:1.1%;width:2.6%;height:6.2%}
    .nav-login{left:79.3%;top:1.3%;width:7.1%;height:6%}
    .nav-start{left:88.1%;top:1.2%;width:8%;height:6.3%}
    .hero-start{left:4.1%;top:50.8%;width:9.1%;height:5.2%}
    .hero-market{left:14.3%;top:50.8%;width:11%;height:5.2%}
    .hero-note{left:4%;top:58.2%;width:22%;height:6.2%;cursor:default}
    @media(max-width:900px){
      .home{min-height:520px}
      .home::before{background-size:auto 100%;background-position:58% center}
      .nav-accueil,.nav-marches,.nav-analyses,.nav-actualites,.nav-about,.nav-search,.nav-login{display:none}
      .home-hit{left:5%;width:35%;top:2%;height:8%}
      .nav-start{left:auto;right:4%;top:2%;width:18%;height:7%}
      .hero-start{left:5%;top:51%;width:18%;height:7%}
      .hero-market{left:25%;top:51%;width:22%;height:7%}
    }
    @media(max-width:600px){
      .home::before{background-size:auto 100%;background-position:62% center}
      .hero-start{left:5%;top:52%;width:22%;height:8%}
      .hero-market{left:29%;top:52%;width:25%;height:8%}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
  <script src="/home-bg-loader.js" defer></script>
</head>
<body>
  <main class="home" aria-label="The Capital — page d'accueil">
    <a class="hit home-hit" href="/" aria-label="Accueil The Capital"></a>
    <a class="hit nav-accueil" href="/" aria-label="Accueil"></a>
    <a class="hit nav-marches" href="/app/app.html#marche" aria-label="Marchés"></a>
    <a class="hit nav-analyses" href="/app/app.html#analyse" aria-label="Analyses"></a>
    <a class="hit nav-actualites" href="/app/app.html#actualites" aria-label="Actualités"></a>
    <a class="hit nav-about" href="/about.html" aria-label="À propos"></a>
    <a class="hit nav-search" href="/app/app.html#recherche" aria-label="Recherche"></a>
    <a class="hit nav-login" href="/app/app.html" aria-label="Se connecter"></a>
    <a class="hit nav-start" href="/register.html" aria-label="Commencer"></a>
    <a class="hit hero-start" href="/register.html" aria-label="Commencer"></a>
    <a class="hit hero-market" href="/app/app.html#marche" aria-label="Explorer la BRVM"></a>
    <span class="hit hero-note" aria-hidden="true"></span>
  </main>
  <script>
    window.addEventListener('load', () => {
      if (!document.body.classList.contains('home-bg-ready')) document.body.classList.add('fallback');
    });
  </script>
</body>
</html>
