<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nouveau mot de passe — The Capital</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0804;--surface:#13110C;--border:rgba(184,150,78,.18);--gold:#B8964E;--gold2:#D4AF6A;--cream:#F5F0E8;--muted:rgba(245,240,232,.5);--green:#4ADE80;--red:#F87171}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#1b150b 0,#0A0804 48%,#070503 100%);color:var(--cream);font-family:"DM Sans",sans-serif;font-weight:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 0}
.logo{display:inline-flex;width:220px;height:62px;margin-bottom:24px}.logo img{width:100%;height:100%;object-fit:contain}
.card{width:min(440px,calc(100% - 28px));background:rgba(24,20,16,.96);border:1px solid var(--border);border-radius:10px;padding:32px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.card:before{content:"";display:block;height:2px;margin:-32px -32px 26px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.title{font:700 23px/1.15 "Playfair Display",serif}.title em{color:var(--gold);font-style:italic}
.sub{font-size:12.5px;color:var(--muted);margin:8px 0 22px;line-height:1.55}
.field{margin-bottom:15px}.field label{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.field input{width:100%;padding:11px 13px;background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--cream);font:14px "DM Sans",sans-serif;outline:none}.field input:focus{border-color:var(--gold)}
.btn{width:100%;padding:13px;margin-top:6px;background:var(--gold);color:var(--bg);border:0;border-radius:5px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}
.msg{margin-top:13px;padding:10px 12px;border-radius:5px;font-size:12.5px;line-height:1.5;display:none}.msg.show{display:block}
.msg.ok{color:var(--green);background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.16)}.msg.err{color:var(--red);background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.16)}
.back{margin-top:20px;text-align:center;font-size:11px;color:var(--muted)}.back a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<a href="/" class="logo"><img src="/assets/the-capital-logo.png" alt="The Capital"></a>
<div class="card">
  <div class="title">Nouveau <em>mot de passe</em></div>
  <div class="sub" id="sub">Choisissez un nouveau mot de passe pour votre compte.</div>
  <form id="form" autocomplete="on">
    <div class="field"><label for="p1">Nouveau mot de passe</label><input type="password" id="p1" autocomplete="new-password" minlength="8" required></div>
    <div class="field"><label for="p2">Confirmer le mot de passe</label><input type="password" id="p2" autocomplete="new-password" minlength="8" required></div>
    <button class="btn" id="btn" type="submit">Enregistrer le mot de passe</button>
  </form>
  <div class="msg" id="msg"></div>
</div>
<div class="back"><a href="/login.html">← Retour à la connexion</a></div>
<script src="/js/env.js"></script>
<script>
(function () {
  'use strict';
  var E = window.TC_ENV;
  var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  var token = hash.get('access_token');
  var form = document.getElementById('form'), btn = document.getElementById('btn');
  function msg(t, c) { var m = document.getElementById('msg'); m.textContent = t; m.className = 'msg show ' + c; }
  if (hash.get('error') || !token) {
    form.style.display = 'none';
    document.getElementById('sub').textContent = '';
    msg(hash.get('error_description') ? 'Lien invalide ou expiré. Demandez un nouveau lien depuis la page de connexion (« Mot de passe oublié »).' : 'Ce lien n’est pas valide. Demandez un nouveau lien depuis la page de connexion.', 'err');
    return;
  }
  history.replaceState(null, '', location.pathname);
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
    if (p1.length < 8) return msg('Le mot de passe doit contenir au moins 8 caractères.', 'err');
    if (p1 !== p2) return msg('Les deux mots de passe ne correspondent pas.', 'err');
    btn.disabled = true; btn.textContent = 'Enregistrement…';
    fetch(E.SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', apikey: E.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token },
      body: JSON.stringify({ password: p1 })
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (!x.ok) { btn.disabled = false; btn.textContent = 'Enregistrer le mot de passe'; return msg((x.d && (x.d.msg || x.d.error_description || x.d.message)) || 'Le lien a expiré. Demandez-en un nouveau.', 'err'); }
        form.style.display = 'none';
        msg('Mot de passe enregistré. Vous pouvez maintenant vous connecter.', 'ok');
        setTimeout(function () { location.replace('/login.html'); }, 1600);
      })
      .catch(function () { btn.disabled = false; btn.textContent = 'Enregistrer le mot de passe'; msg('Erreur réseau. Réessayez.', 'err'); });
  });
})();
</script>
</body>
</html>
