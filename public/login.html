<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Connexion — The Capital</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:#0A0804;
  color:#F5F0E8;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center
}
.card{
  width:min(440px,calc(100% - 32px));
  padding:34px;
  background:#181410;
  border:1px solid rgba(184,150,78,.25);
  border-radius:10px;
  box-shadow:0 30px 80px #0008
}
.logo{
  text-align:center;
  margin-bottom:24px
}
.logo img{
  width:240px;
  height:68px;
  object-fit:contain
}
.title{
  font-size:24px;
  font-weight:700
}
.title em{
  color:#B8964E
}
.sub,
.trial{
  font-size:12px;
  color:#aaa;
  line-height:1.5
}
.trial{
  margin:18px 0;
  padding:12px;
  border:1px solid #b8964e44;
  border-radius:7px
}
.trial strong{
  color:#D4AF6A
}
.field{
  margin:15px 0
}
.field label{
  display:block;
  font-size:10px;
  text-transform:uppercase;
  color:#aaa;
  margin-bottom:7px
}
.field input{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  background:#13110C;
  border:1px solid #b8964e44;
  border-radius:5px;
  color:#fff;
  font-size:14px
}
.btn{
  width:100%;
  padding:13px;
  margin-top:6px;
  background:#B8964E;
  color:#0A0804;
  border:0;
  border-radius:5px;
  font-weight:700;
  cursor:pointer
}
.btn:disabled{
  opacity:.55
}
.msg{
  display:none;
  margin-top:13px;
  padding:10px;
  border-radius:5px;
  font-size:12px;
  line-height:1.5
}
.msg.show{
  display:block
}
.ok{
  color:#4ADE80;
  background:#4ade8010
}
.err{
  color:#F87171;
  background:#f8717110
}
.links{
  text-align:center;
  margin-top:18px;
  font-size:11px
}
.links a{
  color:#D4AF6A
}
.forgot{
  text-align:right;
  font-size:11px;
  color:#aaa;
  text-decoration:underline;
  cursor:pointer;
  margin-top:6px
}
</style>
</head>

<body>

<main class="card">

  <div class="logo">
    <a href="/">
      <img src="/assets/the-capital-logo.png" alt="The Capital">
    </a>
  </div>

  <div class="title">
    Accès <em>espace</em>
  </div>

  <div class="sub">
    Connectez-vous à votre compte The Capital.
  </div>

  <div class="trial">
    <strong>14 jours d'essai gratuit.</strong>
    Les nouveaux comptes bénéficient de 14 jours d'accès complet.
  </div>

  <form id="loginForm">

    <div class="field">
      <label for="email">Adresse email</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        required
      >
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <div class="forgot" id="forgot">
        Mot de passe oublié ?
      </div>
    </div>

    <button
      class="btn"
      id="loginBtn"
      type="submit"
    >
      Se connecter
    </button>

  </form>

  <div
    class="msg"
    id="msg"
  ></div>

  <div class="links">
    <a href="/register.html">Créer un compte</a>
    ·
    <a href="/">Retour à l'accueil</a>
  </div>

</main>

<script>
(function(){

  'use strict';

  const SESSION_KEY = 'tc_session';

  const msg = document.getElementById('msg');
  const btn = document.getElementById('loginBtn');
  const form = document.getElementById('loginForm');
  const forgot = document.getElementById('forgot');

  function showMessage(text, type){

    msg.textContent = text;
    msg.className = 'msg show ' + type;

  }

  /*
   * DESTINATION UNIQUE
   * Aucun Desk Workspace.
   * Aucun ancien redirect.
   */
  function getTarget(){

    return '/app.html';

  }

  async function login(email, password){

    const response = await fetch(
      '/api/auth-login',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Accept':'application/json'
        },
        body:JSON.stringify({
          email:email,
          password:password
        }),
        cache:'no-store'
      }
    );

    let data = {};

    try{
      data = await response.json();
    }catch(e){
      data = {};
    }

    if(
      !response.ok ||
      !data.access_token
    ){

      const rawError = (
        data.error_description ||
        data.msg ||
        data.message ||
        ''
      ).toLowerCase();

      if(
        rawError.includes('email not confirmed')
      ){
        throw new Error(
          'Votre adresse email n’est pas encore confirmée.'
        );
      }

      throw new Error(
        data.error_description ||
        data.msg ||
        data.message ||
        'Email ou mot de passe incorrect.'
      );
    }

    localStorage.setItem(
      SESSION_KEY,
      JSON.stringify(data)
    );

    return data;

  }

  form.addEventListener(
    'submit',
    async function(event){

      event.preventDefault();

      const email =
        document.getElementById('email')
        .value
        .trim()
        .toLowerCase();

      const password =
        document.getElementById('password')
        .value;

      if(
        !email ||
        !password
      ){
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Connexion…';

      msg.className = 'msg';

      try{

        await login(
          email,
          password
        );

        showMessage(
          'Connexion réussie. Ouverture de votre espace…',
          'ok'
        );

        /*
         * Navigation directe.
         * Aucun délai inutile.
         */
        window.location.replace(
          getTarget()
        );

      }catch(error){

        showMessage(
          error && error.message
            ? error.message
            : 'Impossible de se connecter.',
          'err'
        );

        btn.disabled = false;
        btn.textContent = 'Se connecter';

      }

    }
  );

  forgot.addEventListener(
    'click',
    function(){

      const email =
        document.getElementById('email')
        .value
        .trim();

      if(!email){

        showMessage(
          'Saisissez votre adresse email.',
          'err'
        );

        return;
      }

      /*
       * Le flux de récupération existant peut être branché ici.
       * On ne touche pas à l’authentification actuelle.
       */
      showMessage(
        'Utilisez la procédure de récupération de mot de passe prévue pour votre compte.',
        'ok'
      );

    }
  );

})();
</script>

</body>
</html>
