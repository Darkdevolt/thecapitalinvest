<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion The Capital</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root { --bg:#0A0804;--surface:#13110C;--card:#181410;--border:rgba(184,150,78,0.18);--border-s:rgba(245,240,232,0.07);--gold:#B8964E;--gold-light:#D4AF6A;--gold-dim:rgba(184,150,78,0.25);--cream:#F5F0E8;--muted:rgba(245,240,232,0.45);--green:#4ADE80;--red:#F87171;--serif:"Playfair Display",serif;--sans:"DM Sans",sans-serif;--mono:"DM Mono",monospace; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}html,body{height:100%;}body{background:var(--bg);color:var(--cream);font-family:var(--sans);font-weight:300;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;position:relative;overflow:hidden;}body::before{content:"";position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.6;}body::after{content:"";position:fixed;width:600px;height:600px;background:radial-gradient(circle,rgba(184,150,78,0.06) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:0;}.logo-wrap{position:relative;z-index:1;text-align:center;margin-bottom:36px;}.logo{display:inline-flex;align-items:center;justify-content:center;width:260px;height:72px;text-decoration:none;}.logo img{display:block;width:100%;height:100%;object-fit:contain;}.logo-sub{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-top:6px;}.card{position:relative;z-index:1;background:var(--card);border:1px solid var(--border);border-radius:8px;width:100%;max-width:400px;padding:36px 36px 32px;box-shadow:0 32px 80px rgba(0,0,0,0.5),0 0 0 1px rgba(184,150,78,0.05);}.card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;border-radius:8px 8px 0 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);}.card-title{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--cream);margin-bottom:4px;}.card-title em{font-style:italic;color:var(--gold);}.card-sub{font-size:12px;color:var(--muted);margin-bottom:28px;}.tabs{display:flex;gap:0;margin-bottom:24px;border:1px solid var(--border);border-radius:5px;overflow:hidden;}.tab{flex:1;padding:9px;background:none;border:none;color:var(--muted);font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:all .2s;}.tab.active{background:rgba(184,150,78,0.1);color:var(--gold);}.tab:first-child{border-right:1px solid var(--border);}.field{margin-bottom:16px;}.field label{display:block;font-size:10px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}.field input{width:100%;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--cream);font-family:var(--sans);font-size:14px;outline:none;transition:border-color .2s;}.field input:focus{border-color:var(--gold);}.field input::placeholder{color:var(--muted);}.field input.error{border-color:var(--red);}.btn-submit{width:100%;padding:13px;margin-top:8px;background:var(--gold);color:var(--bg);border:none;border-radius:4px;font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;}.btn-submit:hover{background:var(--gold-light);}.btn-submit:disabled{opacity:.5;cursor:not-allowed;}.msg{margin-top:14px;padding:10px 14px;border-radius:4px;font-size:12px;display:none;}.msg.ok{background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.2);color:var(--green);}.msg.err{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);color:var(--red);}.msg.show{display:block;}.back-link{position:relative;z-index:1;margin-top:24px;font-size:12px;color:var(--muted);text-align:center;}.back-link a{color:var(--gold);text-decoration:none;}.back-link a:hover{color:var(--gold-light);}.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(10,8,4,0.3);border-top-color:var(--bg);border-radius:50%;animation:spin .7s linear infinite;}@keyframes spin{to{transform:rotate(360deg);}}.panel{display:none;}.panel.active{display:block;}.forgot{text-align:right;margin-top:4px;font-size:11px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;}.forgot:hover{color:var(--gold);}
@media(max-width:520px){.logo{width:220px;height:62px}.card{width:calc(100% - 28px);padding:28px 24px 26px;}.logo-wrap{margin-bottom:24px}}
</style>
<base target="_blank">
</head>
<body>
<div class="logo-wrap"><a href="index.html" class="logo"><img src="/assets/the-capital-logo.png" alt="The Capital"></a><div class="logo-sub">Bourse Régionale des Valeurs Mobilières</div></div>
<div class="card"><div class="card-title">Accès <em>espace</em></div><div class="card-sub">Connectez-vous pour accéder à votre espace.</div><div class="tabs"><button class="tab active" onclick="location.href='login.html'">Connexion</button><button class="tab" onclick="location.href='register.html'">Inscription</button></div>
<div class="panel active" id="panel-login"><div class="field"><label>Adresse email</label><input type="email" id="l-email" placeholder="vous@exemple.com" autocomplete="email"></div><div class="field"><label>Mot de passe</label><input type="password" id="l-password" placeholder="••••••••" autocomplete="current-password"><div class="forgot" onclick="showForgot()">Mot de passe oublié ?</div></div><button class="btn-submit" id="btn-login" onclick="doLogin()">Se connecter</button><div class="msg" id="login-msg"></div></div>
<div class="panel" id="panel-forgot"><p style="font-size:13px;color:var(--muted);margin-bottom:18px;">Entrez votre email pour recevoir un lien de réinitialisation.</p><div class="field"><label>Adresse email</label><input type="email" id="f-email" placeholder="vous@exemple.com"></div><button class="btn-submit" id="btn-forgot" onclick="doForgot()">Envoyer le lien</button><div class="msg" id="forgot-msg"></div><div style="margin-top:14px;text-align:center;"><span style="font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;" onclick="showLoginPanel()">← Retour à la connexion</span></div></div></div>
<div class="back-link"><a href="index.html">← Retour à l'accueil</a></div>
<script src="js/env.js"></script>
<script>
const SK=TC_ENV.SESSION_KEY;const SB_URL=TC_ENV.SUPABASE_URL;const SB_ANON=TC_ENV.SUPABASE_ANON_KEY;
function isTokenValid(token){try{var parts=token.split(".");var payload=JSON.parse(atob(parts[1]));return payload.exp*1000>Date.now()+60000;}catch(e){return false;}}
(function cleanup(){try{var raw=localStorage.getItem(SK);if(!raw)return;var p=JSON.parse(raw);if(p.access_token&&!isTokenValid(p.access_token))localStorage.removeItem(SK);}catch(e){localStorage.removeItem(SK);}})();
(function(){var s=localStorage.getItem(SK);if(!s)return;try{var sess=JSON.parse(s);if(sess&&sess.access_token&&isTokenValid(sess.access_token)){var dest=new URLSearchParams(location.search).get("redirect")||"app.html";window.location.href=dest;}}catch(e){localStorage.removeItem(SK);}})();
var urlEmail=new URLSearchParams(location.search).get("email");if(urlEmail)document.getElementById("l-email").value=urlEmail;var activeTab="login";
function showLoginPanel(){document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));document.getElementById("panel-login").classList.add("active");document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));document.querySelector(".tab").classList.add("active");activeTab="login";}
function showForgot(){document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));document.getElementById("panel-forgot").classList.add("active");activeTab="forgot";}
function showMsg(id,text,type){var el=document.getElementById(id);el.textContent=text;el.className="msg "+type+" show";}
async function checkAdminWithRetry(userId,accessToken){var headers={"apikey":SB_ANON,"Authorization":"Bearer "+accessToken,"Accept":"application/json"};for(var attempt=0;attempt<3;attempt++){try{var checkUrl=SB_URL+"/rest/v1/users?select=is_admin&id=eq."+encodeURIComponent(userId);var check=await fetch(checkUrl,{headers:headers,cache:"no-store"});if(check.ok){var rows=await check.json();return !!(rows&&rows[0]&&rows[0].is_admin===true);}if(check.status!==401)break;}catch(e){}await new Promise(function(resolve){setTimeout(resolve,300*(attempt+1));});}return false;}
async function doLogin(){var email=document.getElementById("l-email").value.trim();var password=document.getElementById("l-password").value;if(!email||!password){showMsg("login-msg","Veuillez remplir tous les champs.","err");return;}var btn=document.getElementById("btn-login");btn.disabled=true;btn.innerHTML="<span class=\"spin\"></span> Connexion...";try{var r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_ANON},cache:"no-store",body:JSON.stringify({email:email,password:password})});var d=await r.json();if(d.access_token&&d.user){localStorage.setItem(SK,JSON.stringify(d));showMsg("login-msg","Connecté ! Redirection...","ok");setTimeout(async function(){try{var dest=new URLSearchParams(location.search).get("redirect");if(dest)window.location.href=dest;else{var isAdmin=await checkAdminWithRetry(d.user.id,d.access_token);window.location.href=isAdmin?"admin.html":"app.html";}}catch(e){window.location.href="app.html";}},250);}else{var msg=d.error_description||d.msg||"Email ou mot de passe incorrect.";showMsg("login-msg",msg,"err");btn.disabled=false;btn.innerHTML="Se connecter";}}catch(e){showMsg("login-msg","Erreur : "+e.message,"err");btn.disabled=false;btn.innerHTML="Se connecter";}}
async function doForgot(){var email=document.getElementById("f-email").value.trim();if(!email){showMsg("forgot-msg","Entrez votre email.","err");return;}var btn=document.getElementById("btn-forgot");btn.disabled=true;btn.innerHTML="<span class=\"spin\"></span> Envoi...";try{var r=await fetch(SB_URL+"/auth/v1/recover",{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_ANON},body:JSON.stringify({email:email})});if(r.ok)showMsg("forgot-msg","Email envoyé ! Vérifiez votre boite mail.","ok");else showMsg("forgot-msg","Erreur envoi. Vérifiez l'adresse.","err");}catch(e){showMsg("forgot-msg","Erreur réseau.","err");}btn.disabled=false;btn.innerHTML="Envoyer le lien";}
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&activeTab==="login")doLogin();});
</script>
</body>
</html>
