<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Connexion — The Capital</title><meta name="robots" content="noindex,nofollow"><style>body{margin:0;min-height:100vh;background:#0A0804;color:#F5F0E8;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}.card{width:min(440px,calc(100% - 32px));padding:34px;background:#181410;border:1px solid rgba(184,150,78,.25);border-radius:10px;box-shadow:0 30px 80px #0008}.logo{text-align:center;margin-bottom:24px}.logo img{width:240px;height:68px;object-fit:contain}.title{font-size:24px;font-weight:700}.title em{color:#B8964E}.sub,.trial{font-size:12px;color:#aaa;line-height:1.5}.trial{margin:18px 0;padding:12px;border:1px solid #b8964e44;border-radius:7px}.trial strong{color:#D4AF6A}.field{margin:15px 0}.field label{display:block;font-size:10px;text-transform:uppercase;color:#aaa;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;padding:12px;background:#13110C;border:1px solid #b8964e44;border-radius:5px;color:#fff;font-size:14px}.btn{width:100%;padding:13px;margin-top:6px;background:#B8964E;color:#0A0804;border:0;border-radius:5px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55}.msg{display:none;margin-top:13px;padding:10px;border-radius:5px;font-size:12px;line-height:1.5}.msg.show{display:block}.ok{display:block;color:#4ADE80;background:#4ade8010}.err{display:block;color:#F87171;background:#f8717110}.links{text-align:center;margin-top:18px;font-size:11px}.links a{color:#D4AF6A}.forgot{text-align:right;font-size:11px;color:#aaa;text-decoration:underline;cursor:pointer;margin-top:6px}</style></head><body><main class="card"><div class="logo"><a href="/"><img src="/assets/the-capital-logo.png" alt="The Capital"></a></div><div class="title">Accès <em>espace</em></div><div class="sub">Connectez-vous à votre compte The Capital.</div><div class="trial"><strong>14 jours d'essai gratuit.</strong> Les nouveaux comptes bénéficient de 14 jours d'accès complet.</div><form id="loginForm"><div class="field"><label for="email">Adresse email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required><div class="forgot" id="forgot">Mot de passe oublié ?</div></div><button class="btn" id="loginBtn" type="submit">Se connecter</button></form><div class="msg" id="msg"></div><div class="links"><a href="/register.html">Créer un compte</a> · <a href="/">Retour à l'accueil</a><br><br><a href="/mentions-legales.html">Mentions légales</a> · <a href="/confidentialite.html">Confidentialité</a> · <a href="/cgu.html">CGU</a></div></main><script>const SUPABASE_URL='https://otsiwiwlnowxeolbbgvm.supabase.co';const SUPABASE_KEY='sb_publishable_MhaI5b-kMmb5liIMOJ4P3Q_xGTsJAFJ';const SESSION_KEY='tc_session';const params=new URLSearchParams(location.search);const msg=document.getElementById('msg');const btn=document.getElementById('loginBtn');function show(text,type){msg.textContent=text;msg.className='msg show '+type}function redirectTarget(){const r=params.get('redirect');return r&&r.startsWith('/')&&!r.startsWith('//')?r:'/app/app.html'}async function login(email,password){const res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({email,password}),cache:'no-store'});let data={};try{data=await res.json()}catch(e){}if(!res.ok||!data.access_token){const error=(data.error_description||data.msg||'').toLowerCase();if(error.includes('email not confirmed'))throw new Error('Votre adresse email n’est pas encore confirmée. Consultez votre boîte mail.');throw new Error(data.error_description||data.msg||'Email ou mot de passe incorrect.');}localStorage.setItem(SESSION_KEY,JSON.stringify(data));return data}document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase();const password=document.getElementById('password').value;if(!email||!password)return;btn.disabled=true;btn.textContent='Connexion…';msg.className='msg';try{const session=await login(email,password);show('Connexion réussie. Ouverture de votre espace…','ok');setTimeout(()=>location.replace(redirectTarget()),150)}catch(error){show(error.message||'Impossible de se connecter.','err');btn.disabled=false;btn.textContent='Se connecter'}});document.getElementById('forgot').onclick=async()=>{const email=document.getElementById('email').value.trim().toLowerCase();if(!email)return show('Saisissez d’abord votre adresse email.','err');try{const r=await fetch(SUPABASE_URL+'/auth/v1/recover',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({email,redirect_to:location.origin+'/login.html'})});show(r.ok?'Un lien de réinitialisation a été envoyé à votre adresse email.':'Impossible d’envoyer le lien.','ok')}catch(e){show('Erreur réseau. Réessayez.','err')}};</script></body></html>
