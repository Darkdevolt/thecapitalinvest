<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paiements — The Capital Admin</title><meta name="robots" content="noindex,nofollow"><style>
:root{--bg:#0b0b0a;--panel:#121210;--panel2:#181815;--line:rgba(255,255,255,.09);--gold:#b8964e;--cream:#f2eee4;--muted:#9a978f;--green:#4ade80;--red:#f87171;--orange:#f59e0b}*{box-sizing:border-box}body{margin:0;background:#0b0b0a;color:var(--cream);font-family:Arial,sans-serif}.wrap{max-width:1280px;margin:auto;padding:24px 18px 60px}.top{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:24px}.brand{font:700 18px Georgia,serif;letter-spacing:4px}.brand span{color:var(--gold)}.badge{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);border:1px solid rgba(184,150,78,.3);padding:7px 10px}.back{margin-left:auto;color:var(--muted);text-decoration:none;font-size:12px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:2px;text-transform:uppercase}.head h1{font:700 34px Georgia,serif;margin:7px 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:8px}.stat{padding:16px}.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px}.stat strong{display:block;margin-top:8px;font-size:23px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filters button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px 13px;border-radius:5px;cursor:pointer}.filters button.active{border-color:var(--gold);color:var(--cream);background:rgba(184,150,78,.1)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:920px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.table th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px}.status{font-size:10px;font-weight:700;letter-spacing:1px;padding:5px 8px;border-radius:20px;display:inline-block}.pending{color:var(--orange);background:rgba(245,158,11,.1)}.success{color:var(--green);background:rgba(74,222,128,.1)}.failed{color:var(--red);background:rgba(248,113,113,.1)}.actions{display:flex;gap:6px}.btn{border:1px solid var(--line);background:transparent;color:var(--cream);padding:7px 10px;border-radius:5px;cursor:pointer;font-size:11px}.btn.gold{border-color:var(--gold);color:var(--gold)}.btn.red{border-color:rgba(248,113,113,.5);color:var(--red)}.empty,.loading{padding:35px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modalbox{width:min(900px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);padding:22px;border-radius:10px}.modalhead{display:flex;justify-content:space-between;gap:15px}.modal h2{font:700 25px Georgia,serif;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.field{background:var(--panel2);padding:12px;border-radius:6px}.field small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;margin-bottom:6px}.proof-view{background:#080807;min-height:220px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);overflow:hidden}.proof-view img{max-width:100%;max-height:500px}.proof-view iframe{width:100%;height:500px;border:0}.review{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.review input{flex:1;min-width:240px;background:#0b0b0a;border:1px solid var(--line);color:var(--cream);padding:11px;border-radius:5px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.head{display:block}}
</style></head>
<body><div class="wrap"><header class="top"><div class="brand">THE <span>·</span> CAPITAL</div><div class="badge">Payment Verification Center</div><a class="back" href="admin.html">← Administration</a></header><div class="head"><div><div class="eyebrow">Revenue Intelligence</div><h1>Vérification des paiements</h1></div><button class="btn gold" id="refresh">↻ Actualiser</button></div><div class="stats"><div class="stat"><small>À vérifier</small><strong id="s-pending">—</strong></div><div class="stat"><small>Validés</small><strong id="s-success">—</strong></div><div class="stat"><small>Échoués</small><strong id="s-failed">—</strong></div><div class="stat"><small>CA 30 jours</small><strong id="s-30">—</strong></div><div class="stat"><small>CA total</small><strong id="s-total">—</strong></div></div><div class="filters"><button class="active" data-filter="all">Tous</button><button data-filter="processing">À vérifier</button><button data-filter="successful">Validés</button><button data-filter="failed">Rejetés</button></div><section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Client</th><th>Offre</th><th>Période</th><th>Montant</th><th>Statut</th><th>Créé</th><th>Action</th></tr></thead><tbody id="tbody"><tr><td colspan="7" class="loading">Chargement…</td></tr></tbody></table></div></section></div><div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><div><div class="eyebrow">Dossier paiement</div><h2 id="m-title">—</h2></div><button class="btn" onclick="closeModal()">Fermer</button></div><div class="grid" id="m-grid"></div><div class="proof-view" id="proofView">Sélectionnez un reçu</div><div class="review"><input id="reviewNote" placeholder="Note de vérification (facultative)"><button class="btn gold" id="approve">✓ Valider le paiement</button><button class="btn red" id="reject">✕ Rejeter</button><button class="btn" id="info">? Demander des informations</button></div><div id="m-status" style="margin-top:12px;color:var(--muted);font-size:12px"></div></div></div>
<script src="js/env.js"></script>
<script>
// Configuration centralisée : voir public/js/env.js.
// Cette page utilisait encore l'ancienne clé anonyme au format JWT alors que
// le reste du site était passé à la clé « publishable ».
const SB_URL=TC_ENV.SUPABASE_URL;
const SB_ANON=TC_ENV.SUPABASE_ANON_KEY;
let rows=[],filter='all',selected=null;
const session=()=>TC_ENV.getSession();
const token=()=>session()?.access_token||'';const uid=()=>session()?.user?.id||session()?.user?.sub||session()?.data?.user?.id||'';
if(!token()||!uid()){location.replace('login.html?redirect='+encodeURIComponent(location.pathname))}
function hdr(){return{apikey:SB_ANON,Authorization:'Bearer '+token()}}
function money(n){return new Intl.NumberFormat('fr-FR').format(Number(n)||0)+' FCFA'}
async function get(path){const r=await fetch(SB_URL+'/rest/v1/'+path,{headers:hdr()});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.message||'Erreur lecture');return d}
async function rpc(name,body){const r=await fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.message||'Action refusée');return d}
async function load(){try{const proofs=await get('payment_proofs?select=*&order=created_at.desc&limit=200');const orders=await get('payment_orders?select=*&order=created_at.desc&limit=200');const users=await get('users?select=id,email,nom&limit=500');const um=Object.fromEntries(users.map(u=>[u.id,u]));rows=proofs.map(p=>({...p,order:orders.find(o=>o.id===p.payment_order_id),user:um[p.user_id]})).filter(x=>x.order);renderStats();render()}catch(e){document.getElementById('tbody').innerHTML='<tr><td colspan="7" class="empty">'+e.message+'</td></tr>'}}
function renderStats(){const pending=rows.filter(x=>x.status==='pending'||x.status==='needs_info'||x.order?.status==='processing').length;const success=rows.filter(x=>x.status==='approved'||x.order?.status==='successful').length;const failed=rows.filter(x=>x.status==='rejected'||x.order?.status==='failed').length;const approvedOrders=rows.filter(x=>x.order?.status==='successful');const now=Date.now()-30*86400000;const r30=approvedOrders.filter(x=>new Date(x.order.paid_at||x.order.created_at).getTime()>=now).reduce((a,x)=>a+Number(x.order.amount||0),0);const total=approvedOrders.reduce((a,x)=>a+Number(x.order.amount||0),0);document.getElementById('s-pending').textContent=pending;document.getElementById('s-success').textContent=success;document.getElementById('s-failed').textContent=failed;document.getElementById('s-30').textContent=money(r30);document.getElementById('s-total').textContent=money(total)}
function render(){const list=filter==='all'?rows:rows.filter(x=>filter==='processing'?(x.order?.status==='processing'||['pending','needs_info'].includes(x.status)):filter==='successful'?(x.order?.status==='successful'||x.status==='approved'):(x.order?.status==='failed'||x.status==='rejected'));document.getElementById('tbody').innerHTML=list.length?list.map(x=>{const o=x.order;const st=o.status==='successful'?'successful':o.status==='failed'?'failed':'pending';return '<tr><td><strong>'+((x.user?.nom||x.user?.email||x.user_id).replace(/</g,'&lt;'))+'</strong><br><span style="color:var(--muted)">'+(x.user?.email||'')+'</span></td><td>'+String(o.plan_code||'—').toUpperCase()+'</td><td>'+o.billing_period+'</td><td>'+money(o.amount)+'</td><td><span class="status '+st+'">'+(st==='pending'?'À VÉRIFIER':st==='successful'?'VALIDÉ':'REJETÉ')+'</span></td><td>'+new Date(x.created_at).toLocaleString('fr-FR')+'</td><td><button class="btn" onclick="openReview(\''+x.id+'\')">Ouvrir</button></td></tr>'}).join(''):'<tr><td colspan="7" class="empty">Aucun paiement.</td></tr>'}
async function openReview(id){selected=rows.find(x=>x.id===id);if(!selected)return;const o=selected.order;document.getElementById('m-title').textContent=String(o.plan_code||'').toUpperCase()+' — '+money(o.amount);document.getElementById('m-grid').innerHTML='<div class="field"><small>Client</small>'+((selected.user?.email||selected.user_id))+'</div><div class="field"><small>Référence transaction</small>'+(selected.transaction_reference||'Non fournie')+'</div><div class="field"><small>Montant déclaré</small>'+money(selected.claimed_amount)+'</div><div class="field"><small>Commande</small><code>'+o.id+'</code></div><div class="field"><small>Période</small>'+o.billing_period+'</div><div class="field"><small>Soumis le</small>'+new Date(selected.created_at).toLocaleString('fr-FR')+'</div>';document.getElementById('modal').classList.add('open');document.getElementById('m-status').textContent='Chargement du reçu…';try{const r=await fetch(SB_URL+'/storage/v1/object/authenticated/payment-proofs/'+selected.storage_path,{headers:hdr()});if(!r.ok)throw new Error('Reçu inaccessible');const blob=await r.blob();const url=URL.createObjectURL(blob);const pv=document.getElementById('proofView');pv.innerHTML=blob.type==='application/pdf'?'<iframe src="'+url+'"></iframe>':'<img src="'+url+'" alt="Reçu de paiement">';document.getElementById('m-status').textContent='Vérifiez le montant, la référence et la cohérence du reçu avant validation.'}catch(e){document.getElementById('m-status').textContent=e.message}}
function closeModal(){document.getElementById('modal').classList.remove('open');selected=null}
async function review(decision){if(!selected)return;const note=document.getElementById('reviewNote').value.trim();const status=document.getElementById('m-status');status.textContent='Traitement…';try{await rpc('review_payment_proof',{p_proof_id:selected.id,p_reviewer_id:uid(),p_decision:decision,p_reviewer_note:note||null});status.textContent=decision==='approved'?'Paiement validé. Abonnement activé.':decision==='rejected'?'Paiement rejeté.':'Informations supplémentaires demandées.';await load();setTimeout(closeModal,700)}catch(e){status.textContent=e.message}}
document.getElementById('approve').onclick=()=>review('approved');document.getElementById('reject').onclick=()=>review('rejected');document.getElementById('info').onclick=()=>review('needs_info');document.getElementById('refresh').onclick=load;document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('active',x===b));render()});load();
</script></body></html>
