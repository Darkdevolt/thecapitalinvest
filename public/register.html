<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription The Capital</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>body{background:#0A0804;color:#F5F0E8;font-family:"DM Sans",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0}.card{background:#181410;border:1px solid rgba(184,150,78,.18);border-radius:8px;width:100%;max-width:400px;padding:36px;box-sizing:border-box}.logo-wrap{text-align:center;margin-bottom:36px}.logo{display:inline-flex;align-items:center;justify-content:center;width:260px;height:72px;text-decoration:none}.logo img{display:block;width:100%;height:100%;object-fit:contain}.logo-sub,.card-sub{font-size:12px;color:rgba(245,240,232,.45)}.logo-sub{margin-top:6px;font-size:10px;letter-spacing:.2em;text-transform:uppercase}.card-title{font-family:"Playfair Display",serif;font-size:22px;margin-bottom:4px}.logo span,.card-title em{color:#B8964E}.card-sub{margin-bottom:28px}.tabs{display:flex;margin-bottom:24px;border:1px solid rgba(184,150,78,.18);border-radius:5px;overflow:hidden}.tab{flex:1;padding:9px;background:none;border:0;color:rgba(245,240,232,.45);cursor:pointer}.tab.active{background:rgba(184,150,78,.1);color:#B8964E}.field{margin-bottom:16px}.field label{display:block;font-size:10px;text-transform:uppercase;color:rgba(245,240,232,.45);margin-bottom:7px}.field input{width:100%;padding:11px 14px;background:#13110C;border:1px solid rgba(184,150,78,.18);border-radius:4px;color:#F5F0E8;box-sizing:border-box}.btn-submit{width:100%;padding:13px;margin-top:8px;background:#B8964E;color:#0A0804;border:0;border-radius:4px;cursor:pointer}.btn-submit:disabled{opacity:.5}.msg{margin-top:14px;padding:10px 14px;font-size:12px;display:none}.msg.show{display:block}.msg.ok{color:#4ADE80}.msg.err{color:#F87171}.back-link{margin-top:24px;font-size:12px}.back-link a{color:#B8964E;text-decoration:none}@media(max-width:520px){.logo{width:220px;height:62px}.card{width:calc(100% - 28px);padding:28px 24px}.logo-wrap{margin-bottom:24px}}</style>
</head>
<body>
<div class="logo-wrap"><a href="index.html" class="logo"><img src="/assets/the-capital-logo.png" alt="The Capital"></a><div class="logo-sub">Bourse Régionale des Valeurs Mobilières</div></div>
<div class="card"><div class="card-title">Créer un <em>compte</em></div><div class="card-sub">Rejoignez The Capital pour accéder aux données BRVM.</div><div class="tabs"><button class="tab" onclick="location.href='login.html'">Connexion</button><button class="tab active">Inscription</button></div>
<div class="field"><label>Nom complet</label><input type="text" id="s-nom" autocomplete="name"></div><div class="field"><label>Adresse email</label><input type="email" id="s-email" autocomplete="email"></div><div class="field"><label>Mot de passe</label><input type="password" id="s-password" autocomplete="new-password"></div><div class="field"><label>Confirmer le mot de passe</label><input type="password" id="s-password-confirm" autocomplete="new-password"></div><button class="btn-submit" id="btn-signup" onclick="doSignup()">Créer mon compte</button><div class="msg" id="signup-msg"></div></div>
<div class="back-link"><a href="index.html">← Retour à l'accueil</a></div>
<script>
const SK="tc_session";
const SB_URL="https://otsiwiwlnowxeolbbgvm.supabase.co";
const SB_KEY="sb_publishable_MhaI5b-kMmb5liIMOJ4P3Q_xGTsJAFJ";
function showMsg(text,type){const el=document.getElementById("signup-msg");el.textContent=text;el.className="msg "+type+" show";}
async function doSignup(){
 const nom=document.getElementById("s-nom").value.trim(),email=document.getElementById("s-email").value.trim(),password=document.getElementById("s-password").value,confirm=document.getElementById("s-password-confirm").value,btn=document.getElementById("btn-signup");
 if(!nom||!email||!password)return showMsg("Veuillez remplir tous les champs.","err");
 if(password.length<6)return showMsg("Le mot de passe doit faire au moins 6 caractères.","err");
 if(password!==confirm)return showMsg("Les mots de passe ne correspondent pas.","err");
 btn.disabled=true;btn.textContent="Création...";
 try{
  const r=await fetch(SB_URL+"/auth/v1/signup",{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY},body:JSON.stringify({email,password,data:{nom}})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){showMsg(d.error_description||d.msg||d.message||"Impossible de créer le compte.","err");btn.disabled=false;btn.textContent="Créer mon compte";return;}
  if(d.access_token&&d.user){localStorage.setItem(SK,JSON.stringify(d));showMsg("Compte créé ! Redirection...","ok");setTimeout(()=>location.href="app.html",500);return;}
  if(d.user){showMsg("Compte créé ! Vérifiez votre adresse email pour confirmer votre compte.","ok");btn.disabled=false;btn.textContent="Créer mon compte";return;}
  showMsg("Compte traité. Vérifiez votre email pour continuer.","ok");btn.disabled=false;btn.textContent="Créer mon compte";
 }catch(e){showMsg("Erreur réseau : "+e.message,"err");btn.disabled=false;btn.textContent="Créer mon compte";}
}
document.addEventListener("keydown",e=>{if(e.key==="Enter")doSignup()});
</script>
</body></html>
