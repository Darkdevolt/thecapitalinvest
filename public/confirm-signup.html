<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Confirmation — The Capital</title><meta name="robots" content="noindex,nofollow"><style>body{margin:0;min-height:100vh;background:#0A0804;color:#F5F0E8;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}.card{width:min(430px,calc(100% - 40px));box-sizing:border-box;background:#181410;border:1px solid rgba(184,150,78,.22);border-radius:10px;padding:36px;text-align:center}.logo{width:220px;max-width:80%;margin-bottom:28px}.title{font-family:Georgia,serif;font-size:26px}.gold{color:#B8964E}.text{color:rgba(245,240,232,.65);font-size:14px;line-height:1.6;margin:14px 0 24px}.email{color:#F5F0E8;word-break:break-word}.otp{width:100%;box-sizing:border-box;padding:15px;background:#13110C;border:1px solid rgba(184,150,78,.28);border-radius:5px;color:#F5F0E8;text-align:center;font-size:26px;letter-spacing:.35em;font-weight:600;outline:none}.btn{width:100%;box-sizing:border-box;padding:13px 20px;background:#B8964E;color:#0A0804;border:0;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;margin-top:14px}.btn:disabled{opacity:.5}.secondary{background:transparent;color:#B8964E;border:1px solid rgba(184,150,78,.3)}.status{font-size:13px;margin-top:16px;min-height:20px;line-height:1.5}.ok{color:#4ADE80}.err{color:#F87171}.help{margin-top:18px;padding:13px;border:1px solid rgba(184,150,78,.2);border-radius:5px;color:rgba(245,240,232,.65);font-size:12px;line-height:1.6}.small{margin-top:12px;color:rgba(245,240,232,.42);font-size:11px}.resend{margin-top:18px;font-size:12px;color:#B8964E;cursor:pointer}.resend.disabled{opacity:.45;cursor:default}</style></head>
<body><div class="card"><img class="logo" src="/assets/the-capital-logo.png" alt="The Capital"><div class="title">Confirmez votre <span class="gold">email</span></div><div class="text">Saisissez le code temporaire à 6 chiffres reçu par email.</div><div id="emailLabel" class="email"></div><input id="otp" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" aria-label="Code de confirmation à 6 chiffres"><button id="verify" class="btn" onclick="confirmEmail()">Confirmer mon adresse email</button><div id="resend" class="resend" onclick="resendEmail()">Renvoyer le code</div><div id="status" class="status"></div><div class="help"><strong>Vous ne trouvez pas l'email ?</strong><br>Vérifiez Spam / Courrier indésirable, Promotions ou Notifications.</div><div class="small">Le code expire dans 10 minutes et ne peut être utilisé qu'une seule fois.</div></div>
<script>const OTP_URL="/api/signup-otp",params=new URLSearchParams(location.search),email=(params.get("email")||localStorage.getItem("tc_pending_email")||"").trim().toLowerCase(),statusEl=document.getElementById("status"),verifyEl=document.getElementById("verify"),resendEl=document.getElementById("resend"),otpEl=document.getElementById("otp");if(email){localStorage.setItem("tc_pending_email",email);document.getElementById("emailLabel").textContent=email}function status(t,c=""){statusEl.textContent=t;statusEl.className="status "+c}async function confirmEmail(){const code=otpEl.value.replace(/\D/g,"");if(!email)return status("Adresse email manquante. Recommencez l'inscription.","err");if(!/^\d{6}$/.test(code))return status("Entrez les 6 chiffres du code reçu par email.","err");verifyEl.disabled=true;resendEl.classList.add("disabled");status("Vérification du code…");try{const r=await fetch(OTP_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"verify",email,code})}),d=await r.json().catch(()=>({}));if(!r.ok){status(d.error||"Code invalide ou expiré.","err");verifyEl.disabled=false;resendEl.classList.remove("disabled");return}localStorage.removeItem("tc_pending_email");status("Email confirmé. Vous pouvez maintenant vous connecter.","ok");setTimeout(()=>location.href="login.html",900)}catch(e){status("Erreur réseau. Réessayez dans quelques instants.","err");verifyEl.disabled=false;resendEl.classList.remove("disabled")}}async function resendEmail(){if(resendEl.classList.contains("disabled")||!email)return;resendEl.classList.add("disabled");status("Envoi d'un nouveau code…");try{const r=await fetch(OTP_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"resend",email})}),d=await r.json().catch(()=>({}));if(!r.ok){status(d.error||"Impossible de renvoyer le code.","err");resendEl.classList.remove("disabled");return}otpEl.value="";otpEl.focus();status(d.cooldown?"Un code vient déjà d'être envoyé. Réessayez dans quelques secondes.":"Nouveau code envoyé. Vérifiez aussi vos spams.","ok");setTimeout(()=>resendEl.classList.remove("disabled"),30000)}catch(e){status("Erreur réseau. Réessayez dans quelques instants.","err");resendEl.classList.remove("disabled")}}otpEl.addEventListener("input",()=>{otpEl.value=otpEl.value.replace(/\D/g,"").slice(0,6);if(otpEl.value.length===6)confirmEmail()});otpEl.addEventListener("keydown",e=>{if(e.key==="Enter")confirmEmail()});</script></body></html>
