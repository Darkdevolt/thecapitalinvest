<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test API — The Capital</title>
<style>
  body { font-family: monospace; background: #0f0f0f; color: #e0e0e0; padding: 20px; }
  h1 { color: #b8964e; }
  .test { margin: 10px 0; padding: 12px; border-radius: 6px; background: #1a1a1a; border-left: 3px solid #555; }
  .ok { border-left-color: #4ade80; }
  .err { border-left-color: #f87171; }
  .warn { border-left-color: #fbbf24; }
  pre { background: #0a0a0a; padding: 8px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
  button { background: #b8964e; color: #000; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  button:hover { background: #d4b76a; }
  #log { margin-top: 20px; }
</style>
<base target="_blank">
</head>
<body>
<h1>🧪 Diagnostic API The Capital</h1>
<p>Ouvrez la console (F12) avant de cliquer. Ce test vérifie si votre API Vercel répond.</p>
<button onclick="runTests()">▶ Lancer les tests</button>
<div id="log"></div>

<script>
const API_BASE = window.location.origin + '/api';

function log(title, ok, detail) {
  const div = document.createElement('div');
  div.className = 'test ' + (ok ? 'ok' : 'err');
  div.innerHTML = `<strong>${ok ? '✅' : '❌'} ${title}</strong>` +
    (detail ? `<pre>${detail}</pre>` : '');
  document.getElementById('log').appendChild(div);
}

async function runTests() {
  document.getElementById('log').innerHTML = '';

  // TEST 1 : Ping
  try {
    const r = await fetch(API_BASE + '/ping', { method: 'GET' });
    const txt = await r.text();
    log('Ping API', r.ok, `Status: ${r.status}\n${txt.substring(0,500)}`);
  } catch(e) {
    log('Ping API', false, `ERREUR: ${e.message}\n\nL'API ne répond pas du tout. Vérifiez que le déploiement Vercel est actif et que vercel.json est correct.`);
  }

  // TEST 2 : Auth (login faux)
  try {
    const r = await fetch(API_BASE + '/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', email: 'test@test.com', password: 'wrong' })
    });
    const txt = await r.text();
    log('Auth Login (faux mdp)', r.status === 400, `Status: ${r.status}\n${txt.substring(0,500)}\n\nSi status 400 = API OK (refuse le mdp faux).\nSi 404/500 = problème de route ou crash.`);
  } catch(e) {
    log('Auth Login', false, `ERREUR: ${e.message}`);
  }

  // TEST 3 : CORS preflight
  try {
    const r = await fetch(API_BASE + '/auth', {
      method: 'OPTIONS',
      headers: { 'Origin': window.location.origin }
    });
    const cors = r.headers.get('access-control-allow-origin') || 'NON PRÉSENT';
    log('CORS Preflight', r.status === 204 || !!r.headers.get('access-control-allow-origin'), `Status: ${r.status}\nAccess-Control-Allow-Origin: ${cors}`);
  } catch(e) {
    log('CORS Preflight', false, `ERREUR: ${e.message}`);
  }

  // TEST 4 : Marché (public)
  try {
    const r = await fetch(API_BASE + '/marche?type=apercu', { method: 'GET' });
    const txt = await r.text();
    log('Marché Aperçu', r.ok, `Status: ${r.status}\n${txt.substring(0,500)}`);
  } catch(e) {
    log('Marché Aperçu', false, `ERREUR: ${e.message}`);
  }

  // TEST 5 : Config côté client
  const vars = ['NEXT_PUBLIC_SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_ANON_KEY'];
  let envOk = true;
  try {
    // On ne peut pas lire les env côté client, mais on vérifie si le frontend les utilise
    log('Variables env', true, 'Vérifiez dans Vercel Dashboard que vous avez:\n- SUPABASE_URL (ou NEXT_PUBLIC_SUPABASE_URL)\n- SUPABASE_ANON_KEY (ou NEXT_PUBLIC_SUPABASE_ANON_KEY)\n- SUPABASE_SERVICE_ROLE_KEY (ou SUPABASE_SECRET_KEY)\n- ALLOWED_ORIGIN (optionnel)');
  } catch(e) {}
}
</script>
</body>
</html>
