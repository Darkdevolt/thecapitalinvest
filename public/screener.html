<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Screener — The Capital</title>
<script src="/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<script>initNav('outils');</script>

<div class="page-content">
  <div class="page-header">
    <h1>Screener <span style="color:var(--gold)">Avancé</span></h1>
    <p>Filtrez les 47 sociétés cotées selon vos critères de valorisation et performance</p>
  </div>

  <!-- Filtres -->
  <div class="card mb20">
    <div class="card-body" style="padding:20px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px">
        
        <!-- Valorisation -->
        <div>
          <div style="font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Valorisation</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
              <input type="checkbox" id="filt-per" onchange="window.runScreener()"> PER &lt; 15
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
              <input type="checkbox" id="filt-pb" onchange="window.runScreener()"> P/B &lt; 2
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
              <input type="checkbox" id="filt-rdt" onchange="window.runScreener()"> Div. Yield &gt; 5%
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
              <input type="checkbox" id="filt-ev" onchange="window.runScreener()"> EV/EBITDA &lt; 8
            </label>
          </div>
        </div>

        <!-- Rentabilité -->
        <div>
          <div style="font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Rentabilité</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
              <input type="checkbox" id="filt-roe" onchange="window.runScreener()"> ROE &gt; 15%
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
              <input type="checkbox" id="filt-roa" onchange="window.runScreener()"> ROA &gt; 5%
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
              <input type="checkbox" id="filt-marge" onchange="window.runScreener()"> Marge nette &gt; 10%
            </label>
          </div>
        </div>

        <!-- Performance -->
        <div>
          <div style="font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Performance</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
              <input type="checkbox" id="filt-var1m" onchange="window.runScreener()"> Perf. 1M &gt; 5%
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
              <input type="checkbox" id="filt-var3m" onchange="window.runScreener()"> Perf. 3M &gt; 10%
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
              <input type="checkbox" id="filt-var1a" onchange="window.runScreener()"> Perf. 1A &gt; 20%
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
              <input type="checkbox" id="filt-volat" onchange="window.runScreener()"> Volatilité &lt; 30%
            </label>
          </div>
        </div>

        <!-- Qualité -->
        <div>
          <div style="font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Qualité</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
              <input type="checkbox" id="filt-sharpe" onchange="window.runScreener()"> Sharpe &gt; 1
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
              <input type="checkbox" id="filt-beta" onchange="window.runScreener()"> Bêta &lt; 1
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
              <input type="checkbox" id="filt-dettes" onchange="window.runScreener()"> Dette/FP &lt; 1
            </label>
          </div>
        </div>

        <!-- Secteur/Pays -->
        <div>
          <div style="font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Filtres</div>
          <select id="filt-secteur" onchange="window.runScreener()" style="width:100%;padding:8px 10px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--cream);font-size:12px;margin-bottom:8px;">
            <option value="">Tous secteurs</option>
            <option>Banque</option>
            <option>Agro-Alimentaire</option>
            <option>Télécommunications</option>
            <option>Industrie</option>
            <option>Distribution</option>
            <option>Finance</option>
          </select>
          <select id="filt-pays" onchange="window.runScreener()" style="width:100%;padding:8px 10px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--cream);font-size:12px;">
            <option value="">Tous pays</option>
            <option>Côte d'Ivoire</option>
            <option>Sénégal</option>
            <option>Burkina Faso</option>
            <option>Togo</option>
            <option>Mali</option>
            <option>Bénin</option>
          </select>
        </div>
      </div>
      
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="window.runScreener()" style="padding:8px 18px;font-size:12px">▶ Lancer le screener</button>
        <button class="btn btn-outline" onclick="window.resetFilters()" style="padding:8px 18px;font-size:12px">↺ Réinitialiser</button>
        <button class="btn btn-outline" onclick="window.exportResults()" style="padding:8px 18px;font-size:12px">⬇ Exporter CSV</button>
        <span id="screener-count" style="margin-left:auto;font-size:13px;color:var(--muted);align-self:center"></span>
      </div>
    </div>
  </div>

  <!-- Résultats -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Résultats du screener</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Ticker</th>
            <th>Société</th>
            <th class="right">Cours</th>
            <th class="right">PER</th>
            <th class="right">P/B</th>
            <th class="right">Div.Yield</th>
            <th class="right">ROE</th>
            <th class="right">Perf 1A</th>
            <th class="right">Sharpe</th>
            <th>Secteur</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="screener-results">
          <tr><td colspan="11" style="text-align:center;padding:40px;color:var(--dim)">Sélectionnez des critères et lancez le screener</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODULAR SCREENER -->
<script src="app/js/screener.js"></script>
</body>
</html>
